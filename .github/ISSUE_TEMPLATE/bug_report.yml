name: Bug report
description: Something in the template does not work as documented.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security problems do not belong here** — see SECURITY.md and
        report them privately.

        Before filing, please run `dart tools/workspace_setup/configure.dart` on a clean checkout:
        many "does not compile" reports are missing codegen or the gitignored Firebase files
        (docs/en/getting-started/01_setup.md § 3).
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem show up?
      options:
        - App at runtime (apps/mobile or apps/admin)
        - Build / code generation
        - A platform package (platform/*)
        - A sample module (modules/*)
        - Repo tooling (tools/*)
        - CI / Fastlane
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or taps, starting from a clean checkout if you can.
      placeholder: |
        1. dart tools/workspace_setup/configure.dart
        2. cd apps/mobile && flutter run --flavor dev --dart-define-from-file=env.dev
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected instead, and the doc that says so if there is one.
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - apps/mobile
        - apps/admin
        - Not app-specific
    validations:
      required: true
  - type: dropdown
    id: flavor
    attributes:
      label: Flavor and build mode
      multiple: true
      options:
        - dev
        - staging
        - prod
        - debug
        - profile
        - release
        - Not applicable
  - type: input
    id: platform
    attributes:
      label: Platform / device
      placeholder: e.g. Android 15 Pixel 8, iOS 18 simulator, macOS host
  - type: textarea
    id: flutter-version
    attributes:
      label: flutter --version
      description: Paste the full output (prefix with `fvm` if you use it). The pinned version is in `.fvmrc`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant console output, stack traces or failing gate output. Remove tokens and other secrets first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I reproduced this on the latest `main`.
