name: AI Code Review

on:
  pull_request:
    branches: [main, develop, master]
    paths:
      - "apps/*/lib/**/*.dart"
      - "modules/**/*.dart"
      - "platform/**/*.dart"
      - "!**/*.g.dart"
      - "!**/*.freezed.dart"
      - "!**/*.module.dart"
  workflow_dispatch:
    inputs:
      review_scope:
        description: "Review scope"
        required: true
        default: "changed"
        type: choice
        options:
          - changed
          - all
          - domain
          - data
          - platform
          - presentation
      language:
        description: "Report language"
        required: false
        default: "vi"
        type: choice
        options:
          - en
          - vi
          - ja
          - ko
          - zh
      flutter_version:
        description: "Flutter version (empty = the version pinned in .fvmrc)"
        required: false
        default: ""

# The job posts a PR review and PR comments, and reads nothing but the code.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-review:
    name: AI Code Review with Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          # Full history: the manual `changed` scope diffs against the
          # merge-base with the default branch, and changed-files needs the
          # PR base commit.
          fetch-depth: 0

      # The pinned version from .fvmrc unless a manual run names another one.
      # `inputs.flutter_version` is empty on pull_request events, which used
      # to hand the action an empty version and install the latest stable.
      - name: 🎯 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          flutter-version-file: ${{ inputs.flutter_version == '' && '.fvmrc' || '' }}
          channel: "stable"
          cache: true

      - name: 📦 Get dependencies
        run: dart tools/workspace_setup/configure.dart

      # Pinned to a commit, not a tag: tags of this action were rewritten in
      # the March 2025 supply-chain compromise (CVE-2025-30066).
      # One file per line and no shell escaping — the list reaches the script
      # through env, never interpolated into it.
      - name: 📜 Get changed .dart files
        id: changed_files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          separator: "\n"
          safe_output: false
          files: |
            apps/*/lib/**/*.dart
            modules/**/*.dart
            platform/**/*.dart
            apps/*/test/**/*.dart
            modules/**/test/**/*.dart
            platform/**/test/**/*.dart
            !**/*.g.dart
            !**/*.freezed.dart
            !**/*.module.dart

      - name: 🔍 Run Code Review (PR)
        if: github.event_name == 'pull_request' && steps.changed_files.outputs.any_changed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r file; do
            if [ -n "$file" ]; then args+=(--file "$file"); fi
          done <<< "$CHANGED_FILES"

          dart tools/code_review/code_review.dart \
            --format markdown \
            --language vi \
            --output-dir code_review_reports \
            "${args[@]}"

      # Inputs travel through env, never interpolated into the script.
      - name: 🔍 Run Code Review (Manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCOPE: ${{ inputs.review_scope }}
          REPORT_LANG: ${{ inputs.language }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          review() { dart tools/code_review/code_review.dart --language "$REPORT_LANG" --format markdown "$@"; }

          if [ "$SCOPE" = "all" ]; then
            review --all
          elif [ "$SCOPE" = "domain" ] || [ "$SCOPE" = "data" ]; then
            # One run per module layer: --folder takes a single directory.
            for dir in modules/*/"$SCOPE"; do
              [ -d "$dir" ] || continue
              review --folder "$dir"
            done
          elif [ "$SCOPE" = "platform" ]; then
            review --folder platform
          elif [ "$SCOPE" = "presentation" ]; then
            for dir in modules/*/feature apps; do
              [ -d "$dir" ] || continue
              review --folder "$dir"
            done
          else
            # `changed` = what this branch changes relative to the default
            # branch. The tool's own --changed means `git diff HEAD` — the
            # uncommitted changes — which on a fresh checkout is nothing.
            git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            base="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)"
            args=()
            while IFS= read -r file; do
              if [ -n "$file" ]; then args+=(--file "$file"); fi
            done < <(git diff --name-only --diff-filter=ACMRT "$base" HEAD -- apps modules platform \
                       | grep -E '^(apps/[^/]+/(lib|test)/|modules/|platform/).*\.dart$' \
                       | grep -vE '\.(g|freezed|module)\.dart$' || true)
            if [ "${#args[@]}" -eq 0 ]; then
              echo "::notice::No Dart file changed relative to origin/$DEFAULT_BRANCH ($base); nothing to review."
              exit 0
            fi
            review "${args[@]}"
          fi

      - name: 📊 Upload Review Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-review-report-${{ github.run_number }}
          path: code_review_reports/
          retention-days: 30

      - name: 📝 Comment PR with Inline Suggestions
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { repo: { owner, repo }, issue: { number: issue_number } } = context;

            // Helper to check if a line is in the PR's diff
            const isLineInDiff = (filePath, lineNumber, diffs) => {
              const fileDiff = diffs.find(d => d.filename === filePath);
              // `patch` is absent for binary files and very large diffs.
              if (!fileDiff || !fileDiff.patch) return false;

              const hunks = fileDiff.patch.split('\n').filter(line => line.startsWith('@@'));
              for (const hunk of hunks) {
                const match = hunk.match(/@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/);
                if (match) {
                  const startLine = parseInt(match[1]);
                  const lineCount = parseInt(match[2] || '1');
                  if (lineNumber >= startLine && lineNumber < startLine + lineCount) {
                    return true;
                  }
                }
              }
              return false;
            };

            // 1. Get PR diff and find the report file
            // Paginated: listFiles returns at most 100 files per page (30 by
            // default), and a file missing here gets no inline comments.
            const diffs = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            const reportsDir = 'code_review_reports';
            if (!fs.existsSync(reportsDir)) {
              console.log('No reports directory found. Skipping comment.');
              return;
            }
            const files = fs.readdirSync(reportsDir)
              .filter(f => f.startsWith('code_review_report_'))
              .sort()
              .reverse();

            if (files.length === 0) {
              // If no report file, it might mean no issues were found. Post a success message.
              const existingComments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const botComment = existingComments.find(comment => comment.user.login === 'github-actions[bot]' && comment.body.includes('AI Code Review Results'));
              if (!botComment) {
                 await github.rest.issues.createComment({
                    owner, repo, issue_number,
                    body: '## 🤖 AI Code Review Results\n\n✅ **Tuyệt vời!** Không tìm thấy vấn đề nào trong các file đã thay đổi.'
                 });
              }
              return;
            }

            const reportPath = path.join(reportsDir, files[0]);
            const report = fs.readFileSync(reportPath, 'utf8');

            // 2. Parse the report to extract inline comments
            const inlineComments = [];
            const generalIssues = [];
            const fileSections = report.split('## 📄 ').slice(1);

            for (const section of fileSections) {
              const pathMatch = section.match(/\*\*Đường dẫn:\*\* `(.+?)`/);
              if (!pathMatch) continue;
              const filePath = pathMatch[1];

              const issueRegex = /-\s+\*\*Line\*\*:\s*([\d, ]+)\n\s+-\s+\*\*Problem\*\*:\s*([\s\S]+?)\n\s+-\s+\*\*Impact\*\*:\s*([\s\S]+?)\n\s+-\s+\*\*Fix\*\*:\s*([\s\S]+?)(?=\n\s*-\s+\*\*Line\*\*|\n\n\n|###|---)/g;
              let issueMatch;
              while ((issueMatch = issueRegex.exec(section)) !== null) {
                const lines = issueMatch[1].split(',').map(s => parseInt(s.trim()));
                const problem = issueMatch[2].trim();
                const impact = issueMatch[3].trim();
                const fix = issueMatch[4].trim();

                const commentBody = `**🤖 AI Suggestion:**\n\n- **Vấn đề:** ${problem}\n- **Ảnh hưởng:** ${impact}\n- **Gợi ý:** ${fix}`;

                const targetLine = lines[lines.length - 1]; // Comment on the last line of the range

                if (isLineInDiff(filePath, targetLine, diffs)) {
                  inlineComments.push({
                    path: filePath,
                    line: targetLine,
                    body: commentBody,
                  });
                } else {
                  // Group non-inline issues by file path
                  let fileGroup = generalIssues.find(g => g.path === filePath);
                  if (!fileGroup) {
                    fileGroup = { path: filePath, comments: [] };
                    generalIssues.push(fileGroup);
                  }
                  fileGroup.comments.push(`- **Dòng ~${lines.join(', ')}**: ${problem}\n  - **Gợi ý**: ${fix}`);
                }
              }
            }

            // 3. Create a summary comment and post the review
            const summaryHeader = `## 🤖 AI Code Review Results\n\n`;
            const summaryFooter = `\n\n---\n\n*Các gợi ý chi tiết đã được thêm trực tiếp vào các dòng code liên quan.*\n\n🔗 **Xem báo cáo đầy đủ và workflow run tại đây:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            let summaryBody = (report.match(/# 📊 PHẦN 1: TỔNG QUAN[\s\S]+?(?=# 🔍 PHẦN 2:)/) || [""])[0];

            if (generalIssues.length > 0) {
              summaryBody += `\n\n### ⚠️ Các vấn đề ngoài phạm vi thay đổi\n\n*Một số vấn đề được tìm thấy trong các file nhưng nằm ngoài những dòng code bạn đã thay đổi. Các vấn đề này đã được gộp lại và bình luận riêng trên PR.*`;
            }

            // Post the main review with inline comments
            if (inlineComments.length > 0 || summaryBody.trim().length > 0) {
               await github.rest.pulls.createReview({
                owner, repo,
                pull_number: issue_number,
                commit_id: context.payload.pull_request.head.sha,
                event: 'COMMENT',
                body: summaryHeader + summaryBody + summaryFooter,
                comments: inlineComments,
              });
            }

            // Post separate comments for issues outside the diff
            for (const fileIssue of generalIssues) {
                const fileCommentBody = `### 🤖 AI Review cho file \`${fileIssue.path}\`\n\n(Các vấn đề này nằm ngoài phạm vi thay đổi của PR nên không thể bình luận inline)\n\n---\n\n${fileIssue.comments.join('\n\n---\n\n')}`;
                await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number,
                    body: fileCommentBody,
                });
            }

      # Counts files the report marks HIGH priority. Each file section of the
      # report carries one line `**<Priority label>:** 🔴 HIGH` (written by
      # _writeDetailSection in tools/code_review/lib/services/report_service.dart;
      # the label is translated, the value is not). A bare `grep 🔴` also hit
      # the report's legend row `| 🔴 **High** | …`, so it was never zero.
      # Advisory: it annotates, it does not fail the job.
      - name: ❌ Fail on Critical Issues
        if: always()
        run: |
          shopt -s nullglob
          reports=(code_review_reports/code_review_report_*.md)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No review report was produced."
            exit 0
          fi
          CRITICAL_COUNT=$({ grep -hcE '^\*\*[^*]+:\*\* 🔴 HIGH[[:space:]]*$' "${reports[@]}" || true; } \
            | awk '{ s += $1 } END { print s + 0 }')
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::$CRITICAL_COUNT file(s) with HIGH-priority findings in the code review"
            echo "::warning::Please review the detailed report and fix critical issues"
            # Don't fail the build, just warn
            # exit 1
          else
            echo "✅ No critical issues found"
          fi
