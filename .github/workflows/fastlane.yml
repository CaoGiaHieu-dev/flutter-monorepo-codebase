name: Fastlane build and distribute

on:
  workflow_dispatch:
    inputs:
      build-on:
        description: "Build on (iOS needs a Mac with signing set up)"
        required: true
        type: choice
        default: "self-hosted"
        options:
          - self-hosted
          - macos-latest
      platform:
        description: "Platforms (both = `fastlane flutter`: iOS first, then Android)"
        required: true
        type: choice
        default: "both"
        options:
          - both
          - android
          - ios
      flutter_version:
        description: "Flutter version (installed on the runner; the lane checks it)"
        required: true
        default: "3.47.4"
      version:
        description: "App version"
        required: true
        default: "1.0.0"
      build_number:
        description: "Build number. Empty = auto: latest on the store/Firebase + 1 (pubspec number when distributing nowhere)"
        required: false
      flavor:
        description: "Flavor"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - staging
          - prod
      change_log:
        description: "Change log"
        required: true
        default: "Initial release"
      build_type:
        description: "Android build type (apk or aab)"
        required: true
        type: choice
        default: "apk"
        options:
          - apk
          - aab
      distribute_store:
        description: "Distribute to the stores (Play Store / TestFlight)?"
        required: true
        type: boolean
        default: false
      track:
        description: "Play Store track (used only when distributing to the store)"
        required: true
        type: choice
        default: "internal"
        options:
          - internal
          - closed
          - production
      distribute_firebase:
        description: "Distribute to Firebase App Distribution?"
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ${{ inputs.build-on }}
    env:
      # fastlane requires a UTF-8 locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FLAVOR: ${{ inputs.flavor }}
      PLATFORM: ${{ inputs.platform }}
      DISTRIBUTE_STORE: ${{ inputs.distribute_store }}
      DISTRIBUTE_FIREBASE: ${{ inputs.distribute_firebase }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "17"

      # The root Gemfile lists fastlane + cocoapods and loads the plugins from
      # apps/mobile/fastlane/Pluginfile (via fastlane/Pluginfile), so no
      # `fastlane add_plugin` step is needed — that command is interactive and
      # fails on a runner.
      - name: Set up Ruby (bundle install at the repository root)
        if: ${{ inputs.build-on != 'self-hosted' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install gems (self-hosted)
        if: ${{ inputs.build-on == 'self-hosted' }}
        run: bundle install

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: "stable"
          cache: true

      # Everything below is gitignored, so a clean checkout has none of it.
      # Each file comes from a base64 secret (`base64 -w0 <file>`); a missing
      # secret fails the job here, naming the secret, instead of failing
      # halfway through a build. Only the flavor being built is restored.
      # The list and how to produce each secret: docs/en/operations/01_cicd.md §7.
      - name: Restore gitignored build inputs from secrets
        shell: bash
        env:
          FASTLANE_CONFIG_YAML_B64: ${{ secrets.FASTLANE_CONFIG_YAML_B64 }}
          FIREBASE_OPTIONS_DEV_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DEV_DART_B64 }}
          FIREBASE_OPTIONS_STAGING_DART_B64: ${{ secrets.FIREBASE_OPTIONS_STAGING_DART_B64 }}
          FIREBASE_OPTIONS_PROD_DART_B64: ${{ secrets.FIREBASE_OPTIONS_PROD_DART_B64 }}
          GOOGLE_SERVICES_DEV_JSON_B64: ${{ secrets.GOOGLE_SERVICES_DEV_JSON_B64 }}
          GOOGLE_SERVICES_STAGING_JSON_B64: ${{ secrets.GOOGLE_SERVICES_STAGING_JSON_B64 }}
          GOOGLE_SERVICES_PROD_JSON_B64: ${{ secrets.GOOGLE_SERVICES_PROD_JSON_B64 }}
          GOOGLE_SERVICE_INFO_DEV_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_PLIST_B64 }}
          GOOGLE_SERVICE_INFO_STAGING_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_STAGING_PLIST_B64 }}
          GOOGLE_SERVICE_INFO_PROD_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PROD_PLIST_B64 }}
          ENV_PROD_B64: ${{ secrets.ENV_PROD_B64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_PLAY_JSON_KEY_B64: ${{ secrets.GOOGLE_PLAY_JSON_KEY_B64 }}
          APP_STORE_CONNECT_API_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          APP=apps/mobile
          case "$FLAVOR" in
            dev)     KEY=DEV;     ENV_FILE=env.dev ;;
            staging) KEY=STAGING; ENV_FILE=env.stg ;;
            prod)    KEY=PROD;    ENV_FILE=env.prod ;;
            *) echo "::error::Unknown flavor '$FLAVOR'"; exit 1 ;;
          esac
          ANDROID=false; IOS=false
          case "$PLATFORM" in
            both) ANDROID=true; IOS=true ;;
            android) ANDROID=true ;;
            ios) IOS=true ;;
          esac

          missing=0
          fail() { echo "::error title=$1::$2"; missing=1; }
          # restore <secret> <target>: decode a base64 secret into a file.
          restore() {
            local name="$1" target="$2" value="${!1:-}"
            if [ -z "$value" ]; then
              fail "Missing secret $name" "$target is gitignored and required for this build (flavor=$FLAVOR, platform=$PLATFORM). Add it as the base64 secret $name - see docs/en/operations/01_cicd.md section 7."
              return 0
            fi
            mkdir -p "$(dirname "$target")"
            printf '%s' "$value" | base64 --decode > "$target"
            echo "restored $target from $name"
          }

          # fastlane configuration (apps/mobile/fastlane/helpers.rb aborts without it)
          restore FASTLANE_CONFIG_YAML_B64 "$APP/fastlane/Config.yaml"

          # Dart-define file. env.dev / env.stg are committed; env.prod is not.
          if [ "$FLAVOR" = prod ]; then
            restore ENV_PROD_B64 "$APP/env.prod"
          elif [ ! -f "$APP/$ENV_FILE" ]; then
            fail "Missing $APP/$ENV_FILE" "It is committed to git; restore it."
          fi

          # Firebase options. firebase_module.dart imports all three files, so
          # the two flavors not being built get a compile-only stub; injectable
          # registers only the built flavor's options at runtime.
          restore "FIREBASE_OPTIONS_${KEY}_DART_B64" "$APP/lib/firebase/firebase_options_${FLAVOR}.dart"
          for other in dev staging prod; do
            [ "$other" = "$FLAVOR" ] && continue
            file="$APP/lib/firebase/firebase_options_${other}.dart"
            [ -f "$file" ] && continue
            printf '%s\n' \
              "// CI-only stub for a flavor this job does not build. Never used at runtime:" \
              "// injectable registers only the built flavor's FirebaseOptions." \
              "import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;" \
              "" \
              "class DefaultFirebaseOptions {" \
              "  static FirebaseOptions get currentPlatform => const FirebaseOptions(" \
              "        apiKey: 'ci-stub'," \
              "        appId: 'ci-stub'," \
              "        messagingSenderId: 'ci-stub'," \
              "        projectId: 'ci-stub'," \
              "      );" \
              "}" > "$file"
            echo "stubbed $file"
          done

          if [ "$ANDROID" = true ]; then
            # Required by the com.google.gms.google-services Gradle plugin.
            restore "GOOGLE_SERVICES_${KEY}_JSON_B64" "$APP/android/app/src/${FLAVOR}/google-services.json"
            # Prod signing. Without key.properties Gradle silently signs prod
            # with the committed DEV keystore (docs/en/operations/02_fastlane_release.md
            # section 4), so it is required here. dev/staging use the dev keystore.
            if [ "$FLAVOR" = prod ]; then
              restore KEYSTORE_BASE64 "$APP/android/keystore.jks"
              for v in KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
                [ -n "${!v:-}" ] || fail "Missing secret $v" "Required to sign the prod build."
              done
              {
                echo "storePassword=${KEYSTORE_PASSWORD:-}"
                echo "keyPassword=${KEY_PASSWORD:-}"
                echo "keyAlias=${KEY_ALIAS:-}"
                echo "storeFile=../keystore.jks"
              } > "$APP/android/key.properties"
            fi
          fi

          if [ "$IOS" = true ]; then
            # Copied into the app by an Xcode build phase, which only warns
            # when it is missing, so this one is optional.
            name="GOOGLE_SERVICE_INFO_${KEY}_PLIST_B64"
            if [ -n "${!name:-}" ]; then
              restore "$name" "$APP/ios/flavors/${FLAVOR}/GoogleService-Info.plist"
            else
              echo "::warning::$name is not set; the iOS build will have no GoogleService-Info.plist."
            fi
          fi

          [ "$missing" -eq 0 ] || exit 1

          # Credential files: written wherever Config.yaml points. Relative
          # paths there are resolved against apps/mobile/, as helpers.rb does.
          cfg() {
            ruby -ryaml -e 'c = YAML.load_file(ARGV.shift); v = c.dig(*ARGV); puts(v.nil? ? "" : File.expand_path(v.to_s, "apps/mobile"))' \
              "$APP/fastlane/Config.yaml" "$@"
          }
          if [ "$DISTRIBUTE_FIREBASE" = true ]; then
            path="$(cfg firebase credentials_map "$FLAVOR")"
            [ -n "$path" ] || path="$(cfg firebase credentials_map default)"
            if [ -z "$path" ]; then
              fail "Config.yaml" "firebase.credentials_map.$FLAVOR is not set."
            elif [ -z "${FIREBASE_SERVICE_ACCOUNT_KEY:-}" ]; then
              fail "Missing secret FIREBASE_SERVICE_ACCOUNT_KEY" "Firebase distribution needs the service-account JSON (raw, not base64)."
            else
              mkdir -p "$(dirname "$path")"
              printf '%s' "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$path"
              echo "restored $path from FIREBASE_SERVICE_ACCOUNT_KEY"
            fi
          fi
          if [ "$DISTRIBUTE_STORE" = true ] && [ "$ANDROID" = true ]; then
            path="$(cfg paths google_play_key_prod)"
            if [ -z "$path" ]; then fail "Config.yaml" "paths.google_play_key_prod is not set."
            else restore GOOGLE_PLAY_JSON_KEY_B64 "$path"; fi
          fi
          if [ "$DISTRIBUTE_STORE" = true ] && [ "$IOS" = true ]; then
            path="$(cfg paths app_store_connect_key_filepath)"
            if [ -z "$path" ]; then fail "Config.yaml" "paths.app_store_connect_key_filepath is not set."
            else restore APP_STORE_CONNECT_API_KEY_P8_B64 "$path"; fi
          fi

          [ "$missing" -eq 0 ] || exit 1

      # Runs from the repository root: the root fastlane/Fastfile imports the
      # lanes from apps/mobile/fastlane/, which resolve every path absolutely.
      # Inputs travel through env, never interpolated into the script.
      - name: Build and distribute
        shell: bash
        env:
          FLUTTER_VERSION: ${{ inputs.flutter_version }}
          VERSION: ${{ inputs.version }}
          # Empty input = `auto` (see the input's description). Passing it
          # through empty used to reach flutter as --build-number=0.
          BUILD_NUMBER: ${{ inputs.build_number || 'auto' }}
          CHANGE_LOG: ${{ inputs.change_log }}
          BUILD_TYPE: ${{ inputs.build_type }}
          TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            both) lane=(flutter) ;;
            android) lane=(android build) ;;
            ios) lane=(ios build) ;;
          esac
          bundle exec fastlane "${lane[@]}" \
            "flavor:$FLAVOR" \
            "flutter_version:$FLUTTER_VERSION" \
            "version:$VERSION" \
            "build_number:${BUILD_NUMBER:-auto}" \
            "change_log:$CHANGE_LOG" \
            "build_type:$BUILD_TYPE" \
            "distribute_store:$DISTRIBUTE_STORE" \
            "distribute_firebase:$DISTRIBUTE_FIREBASE" \
            "track:$TRACK"
