name: "Build and Distribute"

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flavor"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - staging
          - prod
      version:
        description: "Version"
        required: true
        type: string
        default: 1.0.0
      notes:
        description: "Notes"
        required: false
        type: string
jobs:
  build:
    name: Build & Release
    runs-on: macos-latest

    steps:
      #1 Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

        #2 Setup Java
      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "17"

        #3 Setup Flutter
      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"
          cache: true

        #4 Install Dependencies and Generate
      - name: Install Dependencies
        run: dart tools/workspace_setup/configure.dart

        #5 Setup Env
      - name: Decode Env
        run: |
          echo -n ${{ secrets.ENV }} | base64 -d > .env

        #6 Setup Keystore
      - name: Decode Keystore
        run: |
          echo -n ${{ secrets.KEYSTORE_BASE64 }} | base64 -d > apps/mobile/android/keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > apps/mobile/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> apps/mobile/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> apps/mobile/android/key.properties
          echo "storeFile=../keystore.jks" >> apps/mobile/android/key.properties

        #7 Building APK
      # `.env` and the obfuscation map live at the repository root, and the
      # build runs from the app directory — which is now two levels down, not
      # one. `$GITHUB_WORKSPACE` says root without counting `..`, so moving
      # the app again cannot silently point these at the wrong place.
      - name: Build APK
        run: |
          cd apps/mobile
          flutter build apk --flavor=${{ inputs.flavor }} --build-name=${{ inputs.version }} --build-number=${{ github.run_number }} --dart-define-from-file="$GITHUB_WORKSPACE/.env" --obfuscate --split-debug-info="$GITHUB_WORKSPACE/obfuscate/" --no-tree-shake-icons --verbose

      #   #7 Building App Bundle (aab)
      # - name: Build appBundle
      #   run: flutter build appbundle

      #8 Build IPA ( IOS Build )
      # - name: Build IPA
      #   run: flutter build ipa --no-codesign

      # - name: Compress Archives and IPAs
      #   run: |
      #     cd build
      #     tar -czf ios_build.tar.gz ios

      #8 Distribute Android
      - name: Upload and Distribute App
        uses: nickwph/firebase-app-distribution-action@v1
        with:
          credentials: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          app: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          file: "apps/mobile/build/app/outputs/flutter-apk/app-${{ inputs.flavor}}-release.apk"
          release-notes: |
            Build version: ${{ inputs.version }}+${{ github.run_number }}
            Flavor: ${{ inputs.flavor }}
            Notes: ${{ inputs.notes }}
