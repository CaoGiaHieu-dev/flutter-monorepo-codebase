name: PR Quality Check

# The architecture rules in docs/en/reference/01_rules.md are only real if
# something enforces them. This is that something: it runs on every PR and
# blocks the merge when a gate fails.
on:
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

# Read-only token: the gates only check out and read the repository.
permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The apps the `platforms` job boots on the web and Linux (last step).
    outputs:
      platform_apps: ${{ steps.platforms.outputs.apps }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version comes from .fvmrc — the one place the repo pins it — so
      # CI cannot drift from what `fvm` users build with.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true
          # No lockfile is committed, so the default key (it hashes
          # **/pubspec.lock) never changes: key the pub cache on what decides
          # the versions instead.
          pub-cache-key: flutter-pub-:os:-:version:-${{ hashFiles('pubspec_dependencies.yaml', '**/pubspec.yaml') }}

      # Lock files are generated and not committed: versions come from
      # pubspec_dependencies.yaml (Gate 4 holds every pubspec to it). This
      # plain pub get is all Gates 0 and 1 need — `tools/` is a workspace
      # member — so they run straight after it, before any codegen.
      - name: Get dependencies
        run: flutter pub get

      # Gate 0 — the composition matches its manifest.
      # Runs before anything else and needs no codegen: if injection.dart, an
      # app's dependencies and the root workspace list have drifted from
      # app_manifest.yaml, every later gate is testing something nobody
      # declared. `verify` implies `--strict`: it also fails when a manifest
      # names a module that is not on disk, so a release can never quietly
      # ship without one.
      - name: Composition in sync with manifest
        run: dart tools/composer/composer.dart verify

      # Gate 1 — architecture rules (R1–R22).
      # Needs no codegen of its own: it reads imports and pubspecs, so it
      # runs straight after `pub get` and fails in seconds on a layering
      # mistake instead of after the full setup + analyze + test cycle.
      # `flutter analyze` cannot see these rules at all — nothing in
      # analysis_options.yaml knows that core must not import a feature.
      - name: Architecture rules
        run: dart tools/arch_check/check.dart

      # Gate 1 (continued) — the gate tools' own tests.
      # Every gate in this job is a script under tools/, and a gate that has
      # quietly stopped failing looks exactly like a clean PR. tools/test/
      # builds throwaway workspaces in a temp directory and runs each gating
      # tool against them as a subprocess, asserting exit code and output:
      # arch_check (a clean and a violating fixture for every rule R1-R22),
      # composer verify, dependency_sync --check, docs_check (paths and en↔vi
      # parity), the barrel generator, composer bootstrap, the module
      # generator's argument checks, configure's Firebase stubs and the
      # coverage report. Pure Dart and no codegen, so it runs here rather
      # than in Gate 3, which skips tools/.
      - name: Gate tools' own tests
        working-directory: tools
        run: dart test

      # flutter clean → pub get → gen-l10n → build_runner → barrels → runners.
      # Gates 2+ need the generated code; Gates 0 and 1 above did not. The
      # last step, `composer runners`, generates the native project of every
      # platform an app declares `runner: scaffold` (RULE-83): each app's
      # .gitignore `runners` region ignores them, and a generated runner holds
      # no .dart file, so the barrel gate below is unchanged.
      #
      # --stub-firebase: each app that uses Firebase owns
      # `lib/firebase/firebase_module.dart`, which imports generated
      # `firebase_options_<flavor>.dart` files that are gitignored, so a clean
      # checkout does not compile. Analysis and unit tests never reach
      # Firebase, so the flag writes compile-only stubs for them (and a
      # google-services.json per Android flavor) before any codegen — only
      # where the file is absent, so a workflow that restores real options
      # keeps them. The stub
      # content lives in tools/workspace_setup/firebase_stubs.dart, the one
      # copy CI and docs/en/getting-started/01_setup.md § 3.2 share.
      - name: Install dependencies, run code generation, stub Firebase
        run: dart tools/workspace_setup/configure.dart --stub-firebase

      # Barrel drift gate (RULE-75). configure.dart has just rewritten every
      # package's one barrel (lib/<package>.dart) from the files on disk, after
      # codegen. The barrels are committed and the codegen output is not, so
      # any change to a tracked .dart file now is a barrel that was stale (a
      # file added, renamed or deleted without re-running the generator) or
      # had an `export` added by hand — the generator deletes those. A barrel
      # for a package that has none yet shows up as an untracked file. Fix it
      # locally with `dart tools/barrel_generator/generate.dart <package>/lib`
      # and commit the result.
      - name: Barrels match the generator
        run: |
          set -e
          untracked="$(git ls-files --others --exclude-standard -- '*.dart')"
          if [ -n "$untracked" ]; then
            echo "::error::The barrel generator wrote a file that is not committed (RULE-75):"
            echo "$untracked"
            exit 1
          fi
          if ! git diff --exit-code -- '*.dart'; then
            echo "::error::A barrel differs from what the generator writes: re-run 'dart tools/barrel_generator/generate.dart <package>/lib' and commit (RULE-75)."
            exit 1
          fi

      # Gate 2 — static analysis.
      # Note this cannot see generated code: analysis_options.yaml excludes
      # **.freezed.dart / **.g.dart / **.config.dart / **.module.dart, so a
      # clean analyze does not prove the app builds. The `build` job below
      # covers that — no gate here does.
      - name: Analyze
        run: flutter analyze

      # Gate 3 — tests, per package.
      #
      # Discovered, not globbed. A pattern like `modules/*/*/` encodes today's
      # directory depth, so the day packages move it keeps passing while
      # testing nothing — the worst failure a gate can have. Any directory
      # holding both a pubspec.yaml and a test/ is a package with tests,
      # wherever it lives. The count is asserted for the same reason: a
      # discovery bug that finds zero packages must fail, not succeed quietly.
      # tools/ is the one exception: its tests ran right after Gate 1.
      # --coverage leaves coverage/lcov.info in each package (gitignored) for
      # the report below.
      - name: Test
        run: |
          set -e
          failed=0
          found=0
          while IFS= read -r pubspec; do
            dir=$(dirname "$pubspec")
            [ -d "$dir/test" ] || continue
            [ "$dir" = "./tools" ] && continue
            found=$((found + 1))
            echo "::group::flutter test $dir"
            ( cd "$dir" && flutter test --coverage ) || failed=1
            echo "::endgroup::"
          done < <(find . -name pubspec.yaml -not -path './.git/*' \
                        -not -path '*/build/*' -not -path '*/.dart_tool/*' | sort)
          echo "ran tests in $found package(s)"
          if [ "$found" -eq 0 ]; then
            echo "::error::No package with a test/ directory was found."
            exit 1
          fi
          exit $failed

      # Advisory, not a gate: per-package line coverage (generated files
      # excluded) as a table in this run's job summary. Runs even when a test
      # failed, so the numbers are there to read. No threshold — an adopter
      # who wants one adds `--min <pct>` (total) or `--min-package <pct>`
      # and drops continue-on-error.
      - name: Coverage report (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: dart tools/coverage_report/report.dart

      # Gate 4 — the version catalog is the single source of truth.
      - name: Dependency catalog in sync
        run: dart tools/dependency_sync.dart --check

      # Gate 5 — the documentation describes this tree, not a previous one.
      # Prose rots silently: a package gets renamed and every guide pointing at
      # it keeps the old name, which `flutter analyze` can never see. This
      # resolves every repo path the docs name, lists every dead one, and
      # fails if there is any.
      # Paths that are correctly absent (generated, secret, or a file the
      # reader is told to create) live in tools/docs_check/allowlist.txt.
      # The same run holds every translated pair (docs/en ↔ docs/vi,
      # X.md ↔ X.vi.md) to the same count of headings per level, code blocks
      # and table rows; intentional differences, each with its reason, live
      # in tools/docs_check/parity_allowlist.txt.
      - name: Documentation accuracy
        run: dart tools/docs_check/check.dart

      # RULE-06 — no declared-but-unused package dependency (an
      # undeclared import is Gate 1's rule R5). Blocking: the tree is clean, so
      # a PR that leaves an unused entry in a pubspec is the one that fails.
      # Only unused *files* stay advisory — `check_unused_file.dart` cannot
      # see intentional toolkit APIs and is not run here; see
      # .claude/skills/run_repo_tooling/SKILL.md for what is deliberately kept.
      - name: Unused dependency audit
        run: dart tools/unused_checker/check_unused_packages.dart

      # The `platforms` job's matrix, read from the manifests rather than
      # written here: one row per app that declares web or Linux, e.g.
      # [{"app":"admin","web":true,"linux":true}]. `describe --ci-matrix`
      # prints that one line of JSON and nothing else.
      - name: Platforms to boot (from the manifests, RULE-83)
        id: platforms
        run: echo "apps=$(dart tools/composer/composer.dart describe --ci-matrix pr)" >> "$GITHUB_OUTPUT"

  # Template regression check: generate a module the way a developer would,
  # then hold the result to the same gates as hand-written code. Nothing else
  # exercises the generator's templates — they are mustache files no analyzer
  # reads — so a template that emits an unused dependency, a layering
  # violation or code that no longer analyzes would otherwise ship to the
  # next person who runs it. A BLoC feature with a bottom-nav tab is the
  # widest template: it touches routing, localization, DI and every app
  # manifest. Nothing here is committed; the checkout is thrown away.
  generator-smoke:
    name: Module generator smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true
          pub-cache-key: flutter-pub-:os:-:version:-${{ hashFiles('pubspec_dependencies.yaml', '**/pubspec.yaml') }}

      - name: Get dependencies
        run: flutter pub get

      # The generator runs pub get, gen-l10n, build_runner and the barrels
      # for its own module, but `flutter analyze` needs every other
      # package's generated files as well — and every app's Firebase options
      # (see the quality job).
      - name: Workspace setup
        run: dart tools/workspace_setup/configure.dart --stub-firebase

      # Feature `smoke`, BLoC, bottom-nav tab: registers it in every
      # app_manifest.yaml, runs composer sync and dependency_sync, then
      # codegen.
      - name: Generate a feature module
        run: dart tools/module_generator/generate.dart 1 smoke "" 2 2

      - name: Analyze
        run: flutter analyze

      # The generator emits a page test and a controller test; they must
      # pass untouched, or every new module starts with a red Gate 3.
      - name: The generated module's own tests
        working-directory: modules/smoke/feature
        run: flutter test

      - name: Architecture rules
        run: dart tools/arch_check/check.dart

      - name: Composition in sync with manifest
        run: dart tools/composer/composer.dart verify

      # Blocking only for the generated package: an unused dependency there
      # is a template bug. Anywhere else it is the quality job's audit (also
      # blocking) that owns it; here it is only reported as a warning.
      - name: No unused dependency in the generated module
        run: |
          set +e
          out="$(dart tools/unused_checker/check_unused_packages.dart 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 2 ] && ! grep -q "Package: feature_smoke" <<<"$out"; then
            echo "::warning::Unused dependencies outside the generated module (advisory — see the quality job)."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::The generated module declares a dependency it never uses, or the check failed (exit $code)."
          fi
          exit "$code"

  # Second template regression check, independent of the first: the generator
  # paths `generator-smoke` does not touch. A Provider feature with a stack
  # route (a different state-management template and a different route
  # contribution), the API package (type 6, which wires the feature that
  # already exists), a domain and a data package (types 2 and 3), and a whole
  # new app made by `composer new` that composes them. It holds the result to
  # the same gates, then to the new app's own smoke test, and finally boots the
  # new app on the web (RULE-83), so a template or a composer change that
  # leaves a new app unable to boot fails here. Names are
  # `smoke_p` / `smoke_d` / `smoke_app` so they never collide with the other
  # job. Nothing here is committed; the checkout is thrown away.
  generator-smoke-compose:
    name: Generator smoke test (Provider, API, domain/data, core/custom, new app)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true
          pub-cache-key: flutter-pub-:os:-:version:-${{ hashFiles('pubspec_dependencies.yaml', '**/pubspec.yaml') }}

      - name: Get dependencies
        run: flutter pub get

      - name: Workspace setup
        run: dart tools/workspace_setup/configure.dart --stub-firebase

      # The same order a developer follows: the feature first, then the API
      # package that wires it (generated after the feature, it implements the
      # navigator there), then a domain/data pair. Each registers itself in
      # every existing app_manifest.yaml and runs composer sync.
      - name: Generate a Provider feature, its API package, a domain and a data package
        run: |
          set -e
          dart tools/module_generator/generate.dart 1 smoke_p "" 1 1
          dart tools/module_generator/generate.dart 6 smoke_p
          dart tools/module_generator/generate.dart 2 smoke_d
          dart tools/module_generator/generate.dart 3 smoke_d
          # The paths no other step renders: a feature with no state
          # management and no route (`1 x "" 3 3`), a data package whose
          # domain does not exist, a core package and a custom one.
          dart tools/module_generator/generate.dart 1 smoke_n "" 3 3
          dart tools/module_generator/generate.dart 3 smoke_nd
          dart tools/module_generator/generate.dart 4 smoke_core
          dart tools/module_generator/generate.dart 5 smoke_custom acme

      # A whole app composing the new modules. Without --modules it composes
      # nothing with a screen, and its own smoke test fails with C05 by design.
      # Every platform of a new app is `runner: scaffold`: `composer new`
      # writes no native folder (its .gitignore `runners` region ignores
      # them), and the gates below need none. Only the web runner is generated,
      # after codegen, for the boot at the end of the job.
      - name: Create a new app
        run: dart tools/composer/composer.dart new smoke_app --platforms android,ios,web,linux --modules smoke_p,smoke_d

      # composer new does not run pub get or codegen (its output says so).
      # The barrel pass is per package and must follow codegen (RULE-75); an
      # app has no barrel.
      - name: Resolve, generate code, regenerate barrels
        run: |
          set -e
          flutter pub get
          dart run build_runner build --workspace
          for lib in modules/smoke_p/feature/lib modules/smoke_p/api/lib modules/smoke_d/domain/lib modules/smoke_d/data/lib modules/smoke_n/feature/lib modules/smoke_nd/data/lib platform/infra/smoke_core/lib platform/infra/smoke_custom/lib; do
            dart tools/barrel_generator/generate.dart "$lib"
          done

      # `flutter create` in a temporary directory, then only apps/smoke_app/web/
      # is copied in (plus the database assets, had it linked core_database).
      - name: Generate the new app's web runner
        run: dart tools/composer/composer.dart runners --app smoke_app --platform web

      - name: Composition in sync with manifest
        run: dart tools/composer/composer.dart verify

      - name: Analyze
        run: flutter analyze

      - name: Architecture rules
        run: dart tools/arch_check/check.dart

      - name: Dependency catalog in sync
        run: dart tools/dependency_sync.dart --check

      # The Provider feature ships a page test and a controller test; the new
      # app ships a DI smoke test and a profile test. All must pass untouched.
      # The API, domain and data packages generate no tests, so `flutter test`
      # would fail there with "Test directory not found" — they are not run.
      - name: The generated feature's own tests
        working-directory: modules/smoke_p/feature
        run: flutter test

      - name: The no-state-management feature's own tests
        working-directory: modules/smoke_n/feature
        run: flutter test

      - name: The new app's own tests
        working-directory: apps/smoke_app
        run: flutter test

      # The existing apps now compose the new modules too: their smoke tests
      # prove the generators left their DI graphs bootable.
      - name: The existing apps still boot with the new modules
        run: |
          set -e
          for app in apps/mobile apps/admin; do
            ( cd "$app" && flutter test )
          done

      - name: No unused dependency in the generated packages
        run: |
          set +e
          out="$(dart tools/unused_checker/check_unused_packages.dart 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 2 ] && ! grep -Eq "Package: (feature_smoke_p|smoke_p_api|domain_smoke_d|data_smoke_d|feature_smoke_n|data_smoke_nd|core_smoke_core|acme_smoke_custom|smoke_app_app)$" <<<"$out"; then
            echo "::warning::Unused dependencies outside the generated packages (advisory — see the quality job)."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::A generated package declares a dependency it never uses, or the check failed (exit $code)."
          fi
          exit "$code"

      # A DI graph that resolves is not a screen that is drawn (RULE-83): the
      # new app's integration_test/boot_test.dart runs main() in headless
      # Chrome until the first frame reaches the engine. The same step as the
      # `platforms` job, on the app `composer new` just wrote.
      - name: Chrome and the chromedriver that matches it
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: The new app boots on the web
        working-directory: apps/smoke_app
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          "${{ steps.chrome.outputs.chromedriver-path }}" --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/boot_test.dart \
            -d web-server --browser-name=chrome --headless --chrome-binary="$CHROME_EXECUTABLE" \
            --dart-define-from-file=env.dev --dart-define=APP_FLAVOR=dev

  # RULE-83: a build is not a boot. Every web and Linux target an app declares
  # is generated, built and booted to its first frame, on every PR. One job
  # per app, from the quality job's `platform_apps` (`composer describe
  # --ci-matrix pr`), so a new app or platform needs no edit here. The test is
  # apps/<id>/integration_test/boot_test.dart: it fails while the first frame
  # is deferred (the web blank page) and on any boot error screen. It runs in
  # parallel with `build`. macOS, Windows, iOS and the Android emulator are
  # platforms_full.yml.
  platforms:
    name: Boot ${{ matrix.app }} on web and Linux
    needs: quality
    if: needs.quality.outputs.platform_apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40            # a keyring prompt (M4) blocks forever: never wait on it
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.quality.outputs.platform_apps) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A matched pair: a chromedriver refuses a Chrome of another build, and
      # the image's own pair can drift apart.
      - name: Chrome and the chromedriver that matches it
        if: matrix.web
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true
          pub-cache-key: flutter-pub-:os:-:version:-${{ hashFiles('pubspec_dependencies.yaml', '**/pubspec.yaml') }}

      # The Linux runner's build toolchain and the libsecret that
      # flutter_secure_storage links; Xvfb for a display; a session bus and
      # gnome-keyring for the Secret Service.
      - name: Linux desktop toolchain, X server, session bus, keyring
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev xvfb dbus-x11 gnome-keyring

      - name: Get dependencies
        run: flutter pub get

      # Exactly what an adopter runs on a fresh clone: codegen, the Firebase
      # stubs, then `composer runners` (the gitignored web and Linux runners,
      # with sqlite3.wasm and drift_worker.js for an app that links
      # core_database).
      - name: Set up the workspace (codegen, stubs) and generate the runners
        run: dart tools/workspace_setup/configure.dart --stub-firebase

      - name: Native build-hook downloads (sqlite3) and the wasm cache
        uses: actions/cache@v6      # after configure: its flutter clean wipes .dart_tool
        with:
          path: |
            .dart_tool/hooks_runner/shared
            ~/.cache/flutter_monorepo/sqlite3
          key: hooks-${{ runner.os }}-${{ hashFiles('pubspec_dependencies.yaml') }}

      # `flutter drive -d web-server` asks the chromedriver on port 4444 for a
      # browser; --chrome-binary names the Chrome it must launch (the tool does
      # not read CHROME_EXECUTABLE for a web-server device).
      - name: Boot on the web (flutter drive, headless Chrome)
        if: matrix.web
        working-directory: apps/${{ matrix.app }}
        env:
          CHROME_EXECUTABLE: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          "${{ steps.chrome.outputs.chromedriver-path }}" --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/boot_test.dart \
            -d web-server --browser-name=chrome --headless --chrome-binary="$CHROME_EXECUTABLE" \
            --dart-define-from-file=env.dev --dart-define=APP_FLAVOR=dev

      # A private session bus and an unlocked login keyring: the Secret
      # Service answers, so secure values are stored there. Fresh XDG
      # directories, so no state survives from another step.
      - name: Boot on Linux (an unlocked keyring)
        if: matrix.linux
        working-directory: apps/${{ matrix.app }}
        run: |
          xvfb-run -a dbus-run-session -- bash -ec '
            T=$(mktemp -d); export XDG_DATA_HOME=$T/data XDG_CONFIG_HOME=$T/config XDG_CACHE_HOME=$T/cache XDG_RUNTIME_DIR=$T/run
            mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
            eval "$(printf "ci\n" | gnome-keyring-daemon --unlock --components=secrets)"; export GNOME_KEYRING_CONTROL
            flutter test integration_test/boot_test.dart -d linux --dart-define-from-file=env.dev --dart-define=APP_FLAVOR=dev'

      # No Secret Service at all: the bus address points nowhere, so libsecret
      # fails at once and `secure_storage: memory_fallback` (Linux's derived
      # policy) keeps secure values in memory — the app still boots.
      - name: Boot on Linux (no Secret Service — secure values stay in memory)
        if: matrix.linux
        working-directory: apps/${{ matrix.app }}
        env:
          DBUS_SESSION_BUS_ADDRESS: "unix:path=/nonexistent/bus"   # fails fast (M5); an unset bus autolaunches and hangs
        run: |
          T=$(mktemp -d); export XDG_DATA_HOME=$T/data XDG_CONFIG_HOME=$T/config XDG_CACHE_HOME=$T/cache XDG_RUNTIME_DIR=$T/run
          mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a flutter test integration_test/boot_test.dart -d linux --dart-define-from-file=env.dev --dart-define=APP_FLAVOR=dev

  # Not a gate: the proof that the app actually builds. Gate 2 cannot give it
  # (analysis_options.yaml excludes every generated file), and the release
  # workflows run on demand only — without this job a PR that breaks a
  # `.freezed.dart` / `injection.config.dart` or the Gradle build merges green.
  # It runs after the gates so a layering or analyze failure never pays for a
  # Gradle build.
  build:
    name: Build the dev APK (debug)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # AGP 9 / Gradle 9 need JDK 17+; 17 matches sourceCompatibility,
      # targetCompatibility and jvmTarget in apps/mobile/android/app/build.gradle.kts.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "oracle"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true
          pub-cache-key: flutter-pub-:os:-:version:-${{ hashFiles('pubspec_dependencies.yaml', '**/pubspec.yaml') }}

      - name: Get dependencies
        run: flutter pub get

      # --stub-firebase writes the same compile-only Firebase options as the
      # quality job, plus what an Android build also needs: a
      # google-services.json per flavor, without which the Google Services
      # Gradle plugin fails `processDevDebugGoogleServices`. Its package_name
      # is read from apps/mobile/android/app/build.gradle.kts (applicationId
      # + the flavor's applicationIdSuffix — `.dev` here). Real files, if a
      # workflow ever restores them, are kept.
      - name: Install dependencies, run code generation, stub Firebase
        run: dart tools/workspace_setup/configure.dart --stub-firebase

      # From apps/mobile — the workspace root has no android/. env.dev is
      # committed. Debug needs no release keystore.
      - name: Build APK (dev, debug)
        working-directory: apps/mobile
        run: flutter build apk --flavor dev --debug --dart-define-from-file=env.dev
