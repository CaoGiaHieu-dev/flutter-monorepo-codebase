name: PR Quality Check

# The architecture rules in docs/en/reference/01_rules.md are only real if
# something enforces them. This is that something: it runs on every PR and
# blocks the merge when a gate fails.
on:
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version comes from .fvmrc — the one place the repo pins it — so
      # CI cannot drift from what `fvm` users build with.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      # The workspace pubspec.lock is committed, and this is the step that
      # holds a PR to it: --enforce-lockfile fails when the lockfile no longer
      # matches the pubspecs instead of silently re-resolving it (which the
      # plain `flutter pub get` inside configure.dart would do). It is also
      # all Gates 0 and 1 need — `tools/` is a workspace member — so they run
      # straight after it, before any codegen.
      - name: Get dependencies from the committed lockfile
        run: flutter pub get --enforce-lockfile

      # Gate 0 — the composition matches its manifest.
      # Runs before anything else and needs no codegen: if injection.dart, an
      # app's dependencies and the root workspace list have drifted from
      # app_manifest.yaml, every later gate is testing something nobody
      # declared. `verify` implies `--strict`: it also fails when a manifest
      # names a module that is not on disk, so a release can never quietly
      # ship without one.
      - name: Composition in sync with manifest
        run: dart tools/composer/composer.dart verify

      # Gate 1 — architecture rules.
      # Needs no codegen of its own: it reads imports and pubspecs, so it
      # runs straight after `pub get` and fails in seconds on a layering
      # mistake instead of after the full setup + analyze + test cycle.
      # `flutter analyze` cannot see these rules at all — nothing in
      # analysis_options.yaml knows that core must not import a feature.
      - name: Architecture rules
        run: dart tools/arch_check/check.dart

      # Gate 1 (continued) — the gate tools' own tests.
      # Every gate in this job is a script under tools/, and a gate that has
      # quietly stopped failing looks exactly like a clean PR. tools/test/
      # builds throwaway workspaces in a temp directory and runs each gating
      # tool against them as a subprocess, asserting exit code and output:
      # arch_check (a clean and a violating fixture for every rule R1-R10),
      # composer verify, dependency_sync --check, docs_check (paths and en↔vi
      # parity), the barrel generator, composer bootstrap, the module
      # generator's argument checks, configure's Firebase stubs and the
      # coverage report. Pure Dart and no codegen, so it runs here rather
      # than in Gate 3, which skips tools/.
      - name: Gate tools' own tests
        working-directory: tools
        run: dart test

      # flutter clean → pub get → gen-l10n → build_runner → barrels. Gates 2+
      # need the generated code; Gates 0 and 1 above did not.
      #
      # --stub-firebase: each app that uses Firebase owns
      # `lib/firebase/firebase_module.dart`, which imports generated
      # `firebase_options_<flavor>.dart` files that are gitignored, so a clean
      # checkout does not compile. Analysis and unit tests never reach
      # Firebase, so the flag writes compile-only stubs for them (and a
      # google-services.json per Android flavor) before any codegen — only
      # where the file is absent, so a workflow that restores real options
      # keeps them. The stub
      # content lives in tools/workspace_setup/firebase_stubs.dart, the one
      # copy CI and docs/en/getting-started/01_setup.md § 3.2 share.
      - name: Install dependencies, run code generation, stub Firebase
        run: dart tools/workspace_setup/configure.dart --stub-firebase

      # Gate 2 — static analysis.
      # Note this cannot see generated code: analysis_options.yaml excludes
      # **.freezed.dart / **.g.dart / **.config.dart / **.module.dart, so a
      # clean analyze does not prove the app builds. The `build` job below
      # covers that — no gate here does.
      - name: Analyze
        run: flutter analyze

      # Gate 3 — tests, per package.
      #
      # Discovered, not globbed. A pattern like `modules/*/*/` encodes today's
      # directory depth, so the day packages move it keeps passing while
      # testing nothing — the worst failure a gate can have. Any directory
      # holding both a pubspec.yaml and a test/ is a package with tests,
      # wherever it lives. The count is asserted for the same reason: a
      # discovery bug that finds zero packages must fail, not succeed quietly.
      # tools/ is the one exception: its tests ran right after Gate 1.
      # --coverage leaves coverage/lcov.info in each package (gitignored) for
      # the report below.
      - name: Test
        run: |
          set -e
          failed=0
          found=0
          while IFS= read -r pubspec; do
            dir=$(dirname "$pubspec")
            [ -d "$dir/test" ] || continue
            [ "$dir" = "./tools" ] && continue
            found=$((found + 1))
            echo "::group::flutter test $dir"
            ( cd "$dir" && flutter test --coverage ) || failed=1
            echo "::endgroup::"
          done < <(find . -name pubspec.yaml -not -path './.git/*' \
                        -not -path '*/build/*' -not -path '*/.dart_tool/*' | sort)
          echo "ran tests in $found package(s)"
          if [ "$found" -eq 0 ]; then
            echo "::error::No package with a test/ directory was found."
            exit 1
          fi
          exit $failed

      # Advisory, not a gate: per-package line coverage (generated files
      # excluded) as a table in this run's job summary. Runs even when a test
      # failed, so the numbers are there to read. No threshold — an adopter
      # who wants one adds `--min <pct>` (total) or `--min-package <pct>`
      # and drops continue-on-error.
      - name: Coverage report (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: dart tools/coverage_report/report.dart

      # Gate 4 — the version catalog is the single source of truth.
      - name: Dependency catalog in sync
        run: dart tools/dependency_sync.dart --check

      # Gate 5 — the documentation describes this tree, not a previous one.
      # Prose rots silently: a package gets renamed and every guide pointing at
      # it keeps the old name, which `flutter analyze` can never see. This
      # resolves every repo path the docs name, lists every dead one, and
      # fails if there is any.
      # Paths that are correctly absent (generated, secret, or a file the
      # reader is told to create) live in tools/docs_check/allowlist.txt.
      # The same run holds every translated pair (docs/en ↔ docs/vi,
      # X.md ↔ X.vi.md) to the same count of headings per level, code blocks
      # and table rows; intentional differences, each with its reason, live
      # in tools/docs_check/parity_allowlist.txt.
      - name: Documentation accuracy
        run: dart tools/docs_check/check.dart

      # Advisory: declared-but-unused package dependencies (an undeclared
      # import is Gate 1's rule R5). Not a hard gate
      # because the checker cannot see intentional scaffolding — see
      # .agents/skills/run_unused_checker/SKILL.md for what is deliberately
      # unused and must not be deleted on the tool's word.
      - name: Unused dependency audit (advisory)
        continue-on-error: true
        run: dart tools/unused_checker/check_unused_packages.dart

  # Template regression check: generate a module the way a developer would,
  # then hold the result to the same gates as hand-written code. Nothing else
  # exercises the generator's templates — they are mustache files no analyzer
  # reads — so a template that emits an unused dependency, a layering
  # violation or code that no longer analyzes would otherwise ship to the
  # next person who runs it. A BLoC feature with a bottom-nav tab is the
  # widest template: it touches routing, localization, DI and every app
  # manifest. Nothing here is committed; the checkout is thrown away.
  generator-smoke:
    name: Module generator smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Get dependencies from the committed lockfile
        run: flutter pub get --enforce-lockfile

      # The generator runs pub get, gen-l10n, build_runner and the barrels
      # for its own module, but `flutter analyze` needs every other
      # package's generated files as well — and every app's Firebase options
      # (see the quality job).
      - name: Workspace setup
        run: dart tools/workspace_setup/configure.dart --stub-firebase

      # Feature `smoke`, BLoC, bottom-nav tab: registers it in every
      # app_manifest.yaml, runs composer sync and dependency_sync, then
      # codegen. The lockfile changes here, which is expected.
      - name: Generate a feature module
        run: dart tools/module_generator/generate.dart 1 smoke "" 2 2

      - name: Analyze
        run: flutter analyze

      # The generator emits a page test and a controller test; they must
      # pass untouched, or every new module starts with a red Gate 3.
      - name: The generated module's own tests
        working-directory: modules/smoke/feature
        run: flutter test

      - name: Architecture rules
        run: dart tools/arch_check/check.dart

      - name: Composition in sync with manifest
        run: dart tools/composer/composer.dart verify

      # Blocking only for the generated package: an unused dependency there
      # is a template bug. Anywhere else it is the quality job's advisory
      # audit, and is reported here as a warning.
      - name: No unused dependency in the generated module
        run: |
          set +e
          out="$(dart tools/unused_checker/check_unused_packages.dart 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 2 ] && ! grep -q "Package: feature_smoke" <<<"$out"; then
            echo "::warning::Unused dependencies outside the generated module (advisory — see the quality job)."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::The generated module declares a dependency it never uses, or the check failed (exit $code)."
          fi
          exit "$code"

  # Not a gate: the proof that the app actually builds. Gate 2 cannot give it
  # (analysis_options.yaml excludes every generated file), and the release
  # workflows run on demand only — without this job a PR that breaks a
  # `.freezed.dart` / `injection.config.dart` or the Gradle build merges green.
  # It runs after the gates so a layering or analyze failure never pays for a
  # Gradle build.
  build:
    name: Build the dev APK (debug)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # AGP 9 / Gradle 9 need JDK 17+; 17 matches sourceCompatibility,
      # targetCompatibility and jvmTarget in apps/mobile/android/app/build.gradle.kts.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "oracle"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: "stable"
          cache: true

      - name: Get dependencies from the committed lockfile
        run: flutter pub get --enforce-lockfile

      # --stub-firebase writes the same compile-only Firebase options as the
      # quality job, plus what an Android build also needs: a
      # google-services.json per flavor, without which the Google Services
      # Gradle plugin fails `processDevDebugGoogleServices`. Its package_name
      # is read from apps/mobile/android/app/build.gradle.kts (applicationId
      # + the flavor's applicationIdSuffix — `.dev` here). Real files, if a
      # workflow ever restores them, are kept.
      - name: Install dependencies, run code generation, stub Firebase
        run: dart tools/workspace_setup/configure.dart --stub-firebase

      # From apps/mobile — the workspace root has no android/. env.dev is
      # committed. Debug needs no release keystore.
      - name: Build APK (dev, debug)
        working-directory: apps/mobile
        run: flutter build apk --flavor dev --debug --dart-define-from-file=env.dev
