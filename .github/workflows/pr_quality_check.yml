name: PR Quality Check

# The architecture rules in docs/en/reference/01_rules.md are only real if
# something enforces them. This is that something: it runs on every PR and
# blocks the merge when a gate fails.
on:
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "oracle"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"
          cache: true

      # Each app that uses Firebase owns `lib/firebase/firebase_module.dart`,
      # which imports three generated `firebase_options_*.dart` files that
      # are gitignored, so a clean checkout does not compile. Analysis and
      # unit tests never reach Firebase, so a stub is enough to build —
      # it is written only when the real file is absent, so a workflow
      # that does restore real options keeps them. An app without that
      # module does not use Firebase and gets no stub.
      - name: Stub Firebase options (compile only)
        run: |
          for module in apps/*/lib/firebase/firebase_module.dart; do
          [ -f "$module" ] || continue
          dir="$(dirname "$module")"
          for env in dev staging prod; do
            file="$dir/firebase_options_$env.dart"
            if [ -f "$file" ]; then
              echo "kept existing $file"
              continue
            fi
            cat > "$file" <<'DART'
          // CI-only stub. Not a real Firebase configuration: analysis and unit
          // tests never initialise Firebase, they only need this to compile.
          // Generate the real file with `flutterfire configure`.
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => const FirebaseOptions(
                  apiKey: 'ci-stub',
                  appId: 'ci-stub',
                  messagingSenderId: 'ci-stub',
                  projectId: 'ci-stub',
                );
          }
          DART
            echo "stubbed $file"
          done
          done

      - name: Install dependencies and run code generation
        run: dart tools/workspace_setup/configure.dart

      # Gate 0 — the composition matches its manifest.
      # Runs before anything else and needs no toolchain beyond Dart: if
      # injection.dart, an app's dependencies and the root workspace list have
      # drifted from app_manifest.yaml, every later gate is testing something
      # nobody declared. `--strict` additionally fails when a manifest names a
      # module that is not on disk, so a release can never quietly ship without
      # one.
      - name: Composition in sync with manifest
        run: dart tools/composer/composer.dart verify

      # Gate 1 — architecture rules.
      # Needs no codegen of its own: it reads imports and pubspecs, so it
      # runs straight after setup and fails in seconds on a layering mistake
      # instead of after a full analyze+test cycle. `flutter analyze` cannot see these rules at
      # all — nothing in analysis_options.yaml knows that core must not
      # import a feature.
      - name: Architecture rules
        run: dart tools/arch_check/check.dart

      # Gate 2 — static analysis.
      # Note this cannot see generated code: analysis_options.yaml excludes
      # **.freezed.dart / **.g.dart / **.config.dart / **.module.dart, so a
      # clean analyze does not prove the app builds. Gate 3 covers that.
      - name: Analyze
        run: flutter analyze

      # Gate 3 — tests, per package.
      #
      # Discovered, not globbed. A pattern like `modules/*/*/` encodes today's
      # directory depth, so the day packages move it keeps passing while
      # testing nothing — the worst failure a gate can have. Any directory
      # holding both a pubspec.yaml and a test/ is a package with tests,
      # wherever it lives. The count is asserted for the same reason: a
      # discovery bug that finds zero packages must fail, not succeed quietly.
      - name: Test
        run: |
          set -e
          failed=0
          found=0
          while IFS= read -r pubspec; do
            dir=$(dirname "$pubspec")
            [ -d "$dir/test" ] || continue
            found=$((found + 1))
            echo "::group::flutter test $dir"
            ( cd "$dir" && flutter test ) || failed=1
            echo "::endgroup::"
          done < <(find . -name pubspec.yaml -not -path './.git/*' \
                        -not -path '*/build/*' -not -path '*/.dart_tool/*' | sort)
          echo "ran tests in $found package(s)"
          if [ "$found" -eq 0 ]; then
            echo "::error::No package with a test/ directory was found."
            exit 1
          fi
          exit $failed

      # Gate 4 — the version catalog is the single source of truth.
      - name: Dependency catalog in sync
        run: dart tools/dependency_sync.dart --check

      # Gate 5 — the documentation describes this tree, not a previous one.
      # Prose rots silently: a package gets renamed and every guide pointing at
      # it keeps the old name, which `flutter analyze` can never see. This
      # resolves every repo path the docs name, lists every dead one, and
      # fails if there is any.
      # Paths that are correctly absent (generated, secret, or a file the
      # reader is told to create) live in tools/docs_check/allowlist.txt.
      - name: Documentation accuracy
        run: dart tools/docs_check/check.dart

      # Advisory: declared-but-unused package dependencies (an undeclared
      # import is Gate 1's rule R5). Not a hard gate
      # because the checker cannot see intentional scaffolding — see
      # .agents/skills/run_unused_checker/SKILL.md for what is deliberately
      # unused and must not be deleted on the tool's word.
      - name: Unused dependency audit (advisory)
        continue-on-error: true
        run: dart tools/unused_checker/check_unused_packages.dart
