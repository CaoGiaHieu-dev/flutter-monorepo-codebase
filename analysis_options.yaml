# =============================================================================
# analysis_options.yaml — the one analyzer configuration for the whole
# workspace. Every package (apps/, modules/, platform/, tools/) inherits it;
# no package ships its own, so `flutter analyze` from the root judges all of
# them by the same rules.
#
# BASELINE
#   package:flutter_lints/flutter.yaml (Dart core + recommended + Flutter
#   rules), plus the three strict language modes below and the rules under
#   `linter: rules:`, where `true` adds a rule and `false` removes one the
#   baseline would otherwise apply. CI (Gate 2 of pr_quality_check.yml) fails
#   on any issue, warnings and infos included, so the target is always 0.
#
# STRICT MODES (analyzer: language:)
#   strict-casts      No implicit downcast from `dynamic`. `jsonDecode(...)`,
#                     `map['key']` and other dynamic values must be cast
#                     (`as Map<String, dynamic>`) before use, so a wrong
#                     shape fails where it is read, not three calls later.
#   strict-inference  No silent fallback to `dynamic` when a type argument or
#                     parameter type cannot be inferred: `Future.delayed`
#                     becomes `Future<void>.delayed`, an untyped
#                     `catchError((e, s) {...})` gets `(Object e, StackTrace s)`.
#   strict-raw-types  No generic type without its arguments (`List`,
#                     `StreamSubscription`, `AppFailure`). Write the argument,
#                     even when it is `dynamic` — e.g. `AppFailure<dynamic>`,
#                     whose Freezed equality compares `runtimeType`, so mixing
#                     `<dynamic>` and `<Object?>` would make equal failures
#                     unequal.
#
# KEY RULES ADDED ON TOP OF THE BASELINE
#   unawaited_futures     A Future in an async body must be awaited, or
#                         wrapped in `unawaited(...)` (dart:async) with a
#                         comment saying why fire-and-forget is intended.
#   cancel_subscriptions  A StreamSubscription field must be cancelled in its
#   close_sinks           class; a StreamController/Sink field closed.
#   avoid_dynamic_calls   No member call on a `dynamic` value — cast first.
#   empty_catches         An empty catch needs a comment inside it that says
#                         why dropping the error is safe (the comment is what
#                         satisfies the rule). Prefer narrowing the catch.
#
#   `discarded_futures` is deliberately NOT enabled: it flags every Future
#   started from a synchronous function, which in Flutter is mostly
#   `subscription.cancel()` / `controller.close()` inside a synchronous
#   `dispose()` and `showDialog(...)` from a `void` callback — about 40
#   such hits across the repo, nearly all harmless. `unawaited_futures`
#   covers the async bodies where a missing `await` is a real bug.
#
# GENERATED CODE
#   Excluded below (*.freezed.dart, *.g.dart, *.config.dart, *.module.dart,
#   lib/src/gen/**). Never hand-edit it to satisfy a rule — fix the source
#   and rerun `dart run build_runner build --workspace`. Excluded files are
#   still compiled, so a clean analyze does not prove the app builds; finish
#   with `flutter build apk --flavor dev --debug`.
#
# ADDING A RULE
#   1. Add `rule_name: true` under `linter: rules:` (or a mode under
#      `analyzer: language:`) with a one-line comment saying why.
#   2. Run `flutter analyze` from the root and fix every hit properly.
#      `// ignore:` / `// ignore_for_file:` are not allowed (AGENTS.md: no
#      lint suppressions) — if a rule cannot be satisfied honestly, leave it
#      off and say why here.
#   3. Prove the generator templates still pass: in a throwaway clone, run
#      `dart tools/module_generator/generate.dart 1 smoke "" 2 2` and
#      `flutter analyze` (CI's generator-smoke job does the same).
#   4. Update "Analyzer strictness" in docs/en/reference/01_rules.md § 16
#      and its docs/vi twin.
# =============================================================================

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**.freezed.dart"
    - "**.g.dart"
    - "**.mocks.dart"
    - "**.config.dart"
    - "**.module.dart"
    - "**/core/localization/generated/**"
    - "**/gen/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Freezed / json_serializable put @JsonKey on constructor parameters.
    invalid_annotation_target: ignore

linter:
  rules:
    # --- Async, streams and dynamic values (see header) ---------------------
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_dynamic_calls: true
    # An empty catch must carry a comment saying why the error is dropped.
    empty_catches: true

    # --- Style and correctness ----------------------------------------------
    # Bad: Square(area: var area) | Good: Square(:var area)
    simplify_variable_pattern: true

    # Bad: Point(int x) : x = x; | Good: Point(this.x);
    prefer_initializing_formals: true

    # Bad: import '../../lib/src/utils.dart';
    avoid_relative_lib_imports: true

    # Off: `List<String>` in a doc comment is common and harmless here.
    unintended_html_in_doc_comment: false

    # Off: explicit types on static/top-level declarations are allowed.
    omit_obvious_property_types: false

    # Bad: if (cond); { ... }
    empty_statements: true

    # Bad: list.add('a'); | Good: var list = ['a'];
    prefer_inlined_adds: true

    # A multiline string starts on a new line.
    leading_newlines_in_multiline_strings: true

    # Bad: var a, b;
    avoid_multiple_declarations_per_line: true

    # Flags use of a member deprecated in the same package.
    deprecated_member_use_from_same_package: true

    # Bad: (__) => ... where a single `_` would do.
    unnecessary_underscores: true

    # Bad: MyFile.dart | Good: my_file.dart
    file_names: true

    # Bad: var MyVar; | Good: var myVar;
    non_constant_identifier_names: true

    # Flags an implicit tear-off of a `call()` method.
    implicit_call_tearoffs: true

    # Top-level variables need an inferable or explicit type.
    strict_top_level_inference: true

    # Bad: Child({super.diffName}) // Parent(name) | Good: Child({super.name})
    matching_super_parameters: true

    # Off: trailing commas are left to the formatter (`trailing_commas: preserve`).
    require_trailing_commas: false

    # Bad: print(_);
    no_wildcard_variable_uses: true

    # Off: a `library` name is allowed.
    unnecessary_library_name: false

    # CLI tools use stdout/stderr.writeln, app code a logger — never print().
    avoid_print: true

    # Bad: "Hello" | Good: 'Hello'
    prefer_single_quotes: true

    # Off: `list.forEach((e) => ...)` is allowed.
    avoid_function_literals_in_foreach_calls: false

    # Off: return types may be inferred.
    always_declare_return_types: false

    # Bad: new Foo()
    unnecessary_new: true

    # Bad: else ;
    avoid_empty_else: true

    # dart:, then package:, then relative imports, each sorted.
    directives_ordering: true

    # Off: unused constructor parameters are allowed.
    avoid_unused_constructor_parameters: false

    # Inside one package, import its own lib/ files relatively.
    prefer_relative_imports: true

    # Off: a single-statement if/for/while may omit braces.
    curly_braces_in_flow_control_structures: false

    # Off: constants are UPPER_SNAKE_CASE in this repo (CLAUDE.md naming).
    constant_identifier_names: false

    # Off: arch_check R5 enforces declared dependencies instead.
    depend_on_referenced_packages: false

    # Good: const Text('Hi')
    prefer_const_constructors: true

    # Off: widget constructors need not take a `key`.
    use_key_in_widget_constructors: false

    # NOTE: `unnecessary_await_in_return` was deprecated (Dart 3.13 /
    # Flutter 3.47) and removed from this file. Dropping `await` from a
    # return inside try/finally changes behaviour (finally runs before the
    # Future completes); its successor, `unawaited_return_in_try_block`, is
    # on by default in the analyzer.

    # Bad: '${name}' | Good: '$name'
    unnecessary_brace_in_string_interps: true

    # Bad: const [const Foo()]
    unnecessary_const: true

    # Bad: Foo.new() where Foo() would do.
    unnecessary_constructor_name: true

    # Bad: a getter/setter pair that only wraps a field.
    unnecessary_getters_setters: true

    # Bad: (x) => print(x) | Good: print
    unnecessary_lambdas: true

    # Bad: `late` on a variable initialized at its declaration.
    unnecessary_late: true

    # Bad: x ??= null
    unnecessary_null_aware_assignments: true

    # Bad: a `!` the type already guarantees.
    unnecessary_null_checks: true

    # Bad: x ?? null
    unnecessary_null_in_if_null_operators: true

    # Bad: final String? x = 'a';
    unnecessary_nullable_for_final_variable_declarations: true

    # Bad: an override that only calls super.
    unnecessary_overrides: true

    # Bad: redundant parentheses.
    unnecessary_parenthesis: true

    # Off: raw strings are allowed even without special characters.
    unnecessary_raw_strings: false

    # Bad: a statement with no effect.
    unnecessary_statements: true

    # Bad: an escape the string does not need, e.g. 'a\"b'.
    unnecessary_string_escapes: true

    # Bad: '${myString}' | Good: myString
    unnecessary_string_interpolations: true

    # Bad: this.field where nothing shadows it.
    unnecessary_this: true

    # Bad: [...list.toList()]
    unnecessary_to_list_in_spreads: true

    # Bad: two `case` clauses with the same value.
    no_duplicate_case_values: true

formatter:
  page_width: 80
  trailing_commas: preserve
