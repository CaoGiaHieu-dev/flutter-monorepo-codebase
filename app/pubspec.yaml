name: app
description: "Native Shell / Application Entry Point"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # local packages
  core_common:
    path: ../packages/core/common
  core_network:
    path: ../packages/core/network
  core_storage:
    path: ../packages/core/storage
  core_database:
    path: ../packages/core/database
  provider_state_management:
    path: ../packages/core/provider_state_management
  bloc_state_management:
    path: ../packages/core/bloc_state_management
  core_base_ui:
    path: ../packages/core/base_ui
  core_notifications:
    path: ../packages/core/notifications
  feature_auth:
    path: ../packages/features/auth
  feature_dashboard:
    path: ../packages/features/dashboard
  feature_onboarding:
    path: ../packages/features/onboarding
  feature_splash:
    path: ../packages/features/splash
  feature_home:
    path: ../packages/features/home
  feature_settings:
    path: ../packages/features/settings
  feature_shared:
    path: ../packages/features/shared

  core_di:
    path: ../packages/core/di
  domain_core:
    path: ../packages/domain/core
  domain_auth:
    path: ../packages/domain/auth
  data_core:
    path: ../packages/data/core
  data_auth:
    path: ../packages/data/auth
  domain_language:
    path: ../packages/domain/language
  data_language:
    path: ../packages/data/language
  # external packages

  cupertino_icons: ^1.0.9
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  provider: "^6.1.5+1"
  go_router: "^17.3.0"
  dio: "^5.11.0"
  retrofit: ^4.9.2
  json_annotation: "^4.12.0"
  freezed_annotation: "^3.1.0"
  firebase_core: "^4.11.0"
  get_it: ^9.2.1
  injectable: ^3.0.0
  flutter_native_splash: ^2.4.8
  dynamic_logger: ^0.4.0
  app_links: ^7.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: "^2.15.1"
  json_serializable: "^6.14.0"
  freezed: "^4.0.0-dev.3"
  go_router_builder: "^4.4.0"
  retrofit_generator: "^10.2.7"
  flutter_gen_runner: ^5.14.1
  package_rename: ^1.10.1
  icons_launcher: ^3.1.0
  injectable_generator: "^3.0.2"

flutter:
  generate: true
  uses-material-design: true
