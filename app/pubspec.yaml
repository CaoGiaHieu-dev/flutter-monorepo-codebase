name: app
description: "Native Shell / Application Entry Point"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: "^0.20.3"

  # composer:managed:deps — generated from app_manifest.yaml
  core_common:
    path: ../platform/common
  core_network:
    path: ../platform/network
  core_notifications:
    path: ../platform/notifications
  core_storage:
    path: ../platform/storage
  core_database:
    path: ../platform/database
  core_di:
    path: ../platform/di
  core_base_ui:
    path: ../platform/base_ui
  domain_core:
    path: ../platform/domain_core
  domain_auth:
    path: ../modules/auth/domain
  data_core:
    path: ../platform/data_core
  data_auth:
    path: ../modules/auth/data
  feature_auth:
    path: ../modules/auth/feature
  feature_home:
    path: ../modules/home/feature
  feature_settings:
    path: ../modules/settings/feature
  feature_onboarding:
    path: ../modules/onboarding/feature
  feature_splash:
    path: ../modules/splash/feature
  feature_dashboard:
    path: ../modules/dashboard/feature
  provider_state_management:
    path: ../platform/provider_state_management
  bloc_state_management:
    path: ../platform/bloc_state_management
  platform_kernel:
    path: ../platform/kernel
  core_responsive:
    path: ../platform/responsive
  core_ui_kit:
    path: ../platform/ui_kit
  # composer:end:deps

  # external packages
  material_ui: ^1.1.1
  cupertino_icons: ^1.0.9
  core_responsive:
    path: ../platform/responsive
  flutter_svg: ^2.3.0
  provider: "^6.1.5+1"
  go_router: "^18.0.0"
  dio: "^5.11.0"
  retrofit: "^4.10.0"
  json_annotation: "^4.12.0"
  freezed_annotation: "^3.1.0"
  firebase_core: "^4.13.0"
  get_it: ^9.2.1
  injectable: ^3.0.0
  flutter_native_splash: ^2.4.8
  dynamic_logger: "^0.5.0"
  app_links: "^7.2.1"

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: "^2.16.0"
  json_serializable: "^6.14.1"
  freezed: "^4.0.0-dev.3"
  go_router_builder: "^4.4.0"
  retrofit_generator: "^10.2.8"
  flutter_gen_runner: "^5.15.0"
  package_rename: ^1.10.1
  icons_launcher: ^3.1.0
  injectable_generator: "^3.1.3"

flutter:
  generate: true
  uses-material-design: true
