# Declaration + composition for the `mobile` app. After README.md, the file to read.
#
#   dart tools/composer/composer.dart sync --app mobile     regenerates, all committed, all drift-checked by `verify`:
#     README.md                  region `report`   what this app is, derived from this file and the composed packages
#     lib/app/app_profile.dart   region `facts`    this file as const Dart the shell reads at boot
#     lib/di/injection.dart      regions `imports`, `modules`   DI order and the configureDependencies entry point
#     pubspec.yaml (deps) and the root workspace list   as before
#   dart tools/composer/composer.dart describe --app mobile   prints the report;  `describe --catalog` prints every key below
#
#   app / flavors / env        (b) identity, flavors (and the SSL pin decision each carries), environment values
#   platforms                  (c) where it runs, and what each platform enables
#   capabilities               (d) what the shell may use from this app — absence is a decision, with a reason
#   di_groups / modules        (a) what is composed, in what order, and why
#   lib/app/app_profile.dart   how the shell behaves (typed Dart)
#   lib/app/app_hooks.dart     (e) the typed extension points (code)
#
# Packages are resolved by *name*, discovered by scanning for `pubspec.yaml`.
# Nothing here encodes a directory, so moving packages around does not edit
# this file.

app:
  id: mobile
  name: Codebase
  entrypoint: lib/main.dart

flavors: # closed set: dev | staging | prod
  dev: # ssl_pinning default: disabled — local servers use self-signed certificates
  staging:
    ssl_pinning:
      { disabled: "TEMPLATE PLACEHOLDER: no SPKI pins provisioned — docs/en/guides/08_networking.md § 10" }
  prod:
    # A real decision:  ssl_pinning: { pins: ["<leaf spki sha256 base64>", "<backup spki sha256 base64>"] }
    ssl_pinning:
      { disabled: "TEMPLATE PLACEHOLDER: no SPKI pins provisioned — docs/en/guides/08_networking.md § 10" }

env: # the keys of the env.<flavor> files; checked here, validated again at boot
  BASE_URL: { required_in: [prod] }
  APP_NAME: { } # optional: AppConfig.titleFor falls back to `app.name`
  WEB_DOMAIN: { native_only: true } # read by Gradle / Xcode only — no Dart reader
  APP_LINK_MODE: { native_only: true }

platforms: # a platform missing here is a platform this app does not run on
  android: { runner: committed } # each platform may also set splash, push, deep_links, orientation, window; left out, they are derived or default — README §2 shows the effective values
  ios: { runner: committed }

capabilities: # the optional contracts the shell resolves; `composer describe --catalog` lists them
  session: provided # bundle: ISessionState + ISessionGateway + ISessionRefreshListenable + ISignInLocation
  routes: provided
  tabs: provided
  dashboard: provided
  entry: provided # onboarding on first launch
  post_sign_in: provided # home
  splash: provided
  tree_wrappers: provided
  localization: provided
  error_reporter:
    {
      state: absent,
      reason: "no crash backend chosen: errors are printed and sent nowhere — implement IErrorReporter in lib/app/, then declare it provided (RULE-67)",
    }
  analytics: { state: absent, reason: "no analytics backend chosen: no screen events" }

# ---------------------------------------------------------------------------
# DI groups — ORDERED, and the order is load-bearing.
#
# `configureDependencies()` initialises modules in exactly this sequence. An
# eager `@Singleton` may only depend on a type registered by an earlier group;
# depending on a later one throws "<Type> is not registered" at boot, which
# `flutter analyze` cannot see — RULE-13; test/di_smoke_test.dart catches it.
#
# `phase: before` maps to `externalPackageModulesBefore`, `after` to
# `externalPackageModulesAfter`. `why` records the reason for the slot.
# ---------------------------------------------------------------------------
di_groups:
  - name: core
    phase: before
    packages:
      - core_common
      - core_network
      - core_storage
      - core_database
      - core_di
    why: "mechanism only, registered before anything the app or a module adds. core_database registers nothing: each package that persists data declares its own database"

  - name: notifications
    phase: after
    packages: [core_notifications]
    why: "PushNotificationService is eager and injects FirebaseOptions, which lib/firebase/ registers between the two phases — it cannot sit in core. An app without push drops this group"

  - name: shell
    phase: after
    packages: [platform_shell_adapters, platform_app_shell]
    why: "adapters first (storage adapters, AppBootStorage, NetworkConfig), then router and deep links. ui injects the storage adapters, so shell precedes it"

  - name: ui
    phase: after
    packages: [core_base_ui]
    why: "ThemeProvider and LanguageProvider inject IThemeStorage / ILanguageStorage, which shell registers. They are lazy, so only an eager singleton added here would fail on another order (RULE-13); composer verify holds the order (V16)"

  - name: domain
    phase: after
    packages: [domain_core]
    from_modules: domain
    why: "pure-Dart use cases and repository interfaces: data implements them and features inject them, so domain comes first of the three"

  - name: data
    phase: after
    packages: [data_core]
    from_modules: data
    why: "a module that opens a database with @preResolve runs the migrations contributed before it, so contributors precede it"

  - name: feature
    phase: after
    from_modules: feature
    why: "screens, routes and controllers inject the use cases the domain and data groups register, so features come after both"

  - name: other
    phase: after
    packages:
      - provider_state_management
      - bloc_state_management
    why: "no ordering constraint: the state-management bases register nothing, so they go last by convention"

# ---------------------------------------------------------------------------
# Modules this app composes.
#
# `layers` picks which of a module's packages are included. `api` is the
# module's contracts package (`<id>_api`) other features may import: a
# workspace member only — no DI group collects it and this app does not
# depend on it. A module absent from disk is skipped with a warning by `sync`,
# and is an error under `sync --strict` — which is what CI runs, so a release
# can never silently ship without one.
# ---------------------------------------------------------------------------
modules:
  - { id: auth, layers: [api, domain, data, feature] }
  - { id: home, layers: [api, feature] }
  - { id: settings, layers: [feature] }
  - { id: onboarding, layers: [feature] }
  - { id: splash, layers: [feature] }
  - { id: dashboard, layers: [feature] }
  - { id: cache, layers: [domain, data] }

# `extra_dependencies:` (optional) — a workspace package this app's own lib/
# imports that registers no DI module. Packages reached only through another
# package (core_responsive, core_ui_kit, platform_kernel, ...) need no entry:
# composer walks the pubspecs and adds them to the root `workspace:` list.
