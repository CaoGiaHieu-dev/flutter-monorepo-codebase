# apps/mobile/fastlane/Config.example.yaml
#
# This file serves as an example configuration for your Fastlane setup.
# Copy it to `apps/mobile/fastlane/Config.yaml` (next to this file — gitignored)
# and fill in your actual project details:
#
#   cp apps/mobile/fastlane/Config.example.yaml apps/mobile/fastlane/Config.yaml
#
# In CI, `.github/workflows/fastlane.yml` writes it from the
# FASTLANE_CONFIG_YAML_B64 secret instead.

# Flutter configuration
# `stable` = use whatever Flutter this machine resolves (the .fvmrc pin when
# fvm is installed, otherwise the flutter on PATH). An exact version (e.g.
# "3.47.4") must match that Flutter or the lane stops. Nothing is upgraded
# unless you pass `flutter_upgrade:true`.
flutter:
  default_version: "stable" # e.g., "3.47.4", "stable"

# Default app version to use if not specified when building
default_app_version: "1.0.0" # e.g., "1.0.0"

# List of valid flavors for this project.
# The special 'none' flavor is always supported by default by the Fastfile logic.
valid_flavors:
  - "dev"
  - "staging"
  - "prod"
  # Add or remove flavors as per your project's setup
  # - "qa"
  # - "custom"

# Application Bundle IDs per platform
app_bundle_ids:
  ios: "com.yourcompany.yourapp" # e.g., "com.example.myapp"
  android: "com.yourcompany.yourapp" # e.g., "com.example.myapp"

# Firebase App IDs and Credentials Mapping
# Both maps are looked up by flavor; a flavor with no entry of its own falls
# back to the map's `default` entry (with a warning), as does a flavor-less
# build. Beware: in `app_ids` that means uploading to the default app — give
# every flavor you distribute its own entry.
firebase:
  app_ids:
    # Get these from your Firebase project settings -> Project Overview -> Add App
    # (e.g., 1:XXXXXXXXXXXX:ios:YYYYYYYYYYYYYYYYYYYYYYYY)
    ios:
      dev: "YOUR_FIREBASE_APP_ID_IOS_DEV"
      staging: "YOUR_FIREBASE_APP_ID_IOS_STAGING"
      prod: "YOUR_FIREBASE_APP_ID_IOS_PROD"
      default: "YOUR_FIREBASE_APP_ID_IOS_DEFAULT" # Used when building without a specific flavor (i.e., 'none')
    android:
      dev: "YOUR_FIREBASE_APP_ID_ANDROID_DEV"
      staging: "YOUR_FIREBASE_APP_ID_ANDROID_STAGING"
      prod: "YOUR_FIREBASE_APP_ID_ANDROID_PROD"
      default: "YOUR_FIREBASE_APP_ID_ANDROID_DEFAULT" # Used when building without a specific flavor (i.e., 'none')

  # Mapping of flavors to their corresponding Firebase service account JSON files.
  # Relative paths are resolved against apps/mobile/ (so "fastlane/x.json" is
  # apps/mobile/fastlane/x.json), whichever directory fastlane is started from;
  # absolute paths are used as is. apps/mobile/fastlane/.gitignore already
  # ignores *.json there.
  credentials_map:
    dev: "fastlane/firebase-auth-dev.json"
    staging: "fastlane/firebase-auth-staging.json" # Optional: If you have a separate staging credential file
    prod: "fastlane/firebase-auth.json"
    default: "fastlane/firebase-auth.json" # Default credential file when no flavor is specified (i.e., 'none')

# Apple App Store Connect Configuration
# Generate an API Key in App Store Connect (Users and Access -> Integrations ->
# App Store Connect API). Keep the downloaded file's name: it must be exactly
# `AuthKey_<api_key_id>.p8` (e.g. AuthKey_Z2ABCD6E7F.p8). The TestFlight upload
# runs `xcrun altool --apiKey <api_key_id>`, which takes no key path — it looks
# only for a file of that name, in the directory the lane passes as
# API_PRIVATE_KEYS_DIR (the directory of paths.app_store_connect_key_filepath).
# A differently named file still works, through a temporary renamed copy, with
# a warning; .github/workflows/fastlane.yml refuses it outright.
app_store_connect:
  api_key_id: "<YOUR_APP_STORE_CONNECT_API_KEY_ID>" # e.g., "Z2ABCD6E7F"
  issuer_id: "<YOUR_APP_STORE_CONNECT_ISSUER_ID>" # e.g., "69a6de80-d5d8-47e3-e053-5b8c7c11a4d1"

  # Optional: Fallback for older actions or if API Key is not used. API Key authentication is generally preferred.
  username: "<YOUR_APPLE_DEVELOPER_EMAIL>" # e.g., "developer@example.com"
  team_id: "<YOUR_APPLE_TEAM_ID>" # e.g., "A1B2C3D4E5"
  apple_ids:
    dev: "<YOUR_APPLE_ID_DEV>"
    staging: "<YOUR_APPLE_ID_STAGING>"
    prod: "<YOUR_APPLE_ID_PROD>"
    default: "<YOUR_APPLE_ID_DEFAULT>"

# Google Play Store Configuration
google_play:
  # This ID is used *only* for constructing the console links (e.g., in Discord notifications).
  # The upload actions use the JSON key file for authentication.
  account_id: "<YOUR_GOOGLE_PLAY_DEVELOPER_ACCOUNT_ID>" # e.g., "1234567890123456789"

# File paths used in the Fastfile.
# Relative paths are resolved against apps/mobile/ (the app directory, the
# parent of this file's folder) — NOT against the directory you run fastlane
# from — so the defaults below all point into apps/mobile/fastlane/.
# Absolute paths are used as is.
paths:
  firebase_testers_file: "fastlane/firebase_tester.txt" # List of tester emails for Firebase App Distribution (gitignored)

  # Google Play credentials JSON files
  google_play_key_prod: "fastlane/google-play-store.json"
  google_play_key_dev: "fastlane/google-play-store-dev.json" # Optional: if you have a separate dev key

  # App Store Connect API Key .p8 file. The file name must be
  # AuthKey_<app_store_connect.api_key_id>.p8 — see app_store_connect above.
  app_store_connect_key_filepath: "fastlane/AuthKey_YOURKEYID.p8"

  # (The former `change_log_android` / `change_log_ios` keys are gone: the
  # combined lanes now pass the change log through a temp file outside the
  # repository. Leftover keys in an existing Config.yaml are ignored.)
