name: mobile_app
description: "Native Shell / Application Entry Point"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # composer:managed:deps — generated from app_manifest.yaml
  core_common:
    path: ../../platform/foundation/common
  core_network:
    path: ../../platform/infra/network
  core_storage:
    path: ../../platform/infra/storage
  core_database:
    path: ../../platform/infra/database
  core_di:
    path: ../../platform/foundation/contracts
  core_notifications:
    path: ../../platform/infra/notifications
  platform_app_shell:
    path: ../../platform/shell/app_shell
  core_base_ui:
    path: ../../platform/ui/design_system
  domain_core:
    path: ../../platform/layers/domain
  domain_auth:
    path: ../../modules/auth/domain
  domain_cache:
    path: ../../modules/cache/domain
  data_core:
    path: ../../platform/layers/data
  data_auth:
    path: ../../modules/auth/data
  data_cache:
    path: ../../modules/cache/data
  feature_auth:
    path: ../../modules/auth/feature
  feature_home:
    path: ../../modules/home/feature
  feature_settings:
    path: ../../modules/settings/feature
  feature_onboarding:
    path: ../../modules/onboarding/feature
  feature_splash:
    path: ../../modules/splash/feature
  feature_dashboard:
    path: ../../modules/dashboard/feature
  provider_state_management:
    path: ../../platform/state/provider
  bloc_state_management:
    path: ../../platform/state/bloc
  # composer:end:deps

  # External packages this app itself uses. Everything else — the router,
  # providers, networking, logging — belongs to `platform_app_shell` and the
  # composed modules, which declare their own. This list used to name 17
  # packages left over from when the shell lived in this package; the app
  # imports two of them.
  cupertino_icons: ^1.0.9
  firebase_core: "^4.13.0"     # lib/firebase/firebase_module.dart
  injectable: ^3.0.0           # lib/di/injection.dart

dev_dependencies:
  # test/di_smoke_test.dart: boots the generated DI graph with the plugins'
  # test doubles — the storage plugins' in-memory stores, FlutterFire's
  # Firebase core test API (`firebase_core_platform_interface/test.dart`) and
  # the Android local-notifications implementation, registered by hand;
  # `drift` to close the package-owned databases between boots.
  flutter_test:
    sdk: flutter
  drift: "^2.34.3"
  firebase_core_platform_interface: "^8.1.1"
  flutter_local_notifications: "^22.3.0"
  flutter_secure_storage: "11.2.0"
  shared_preferences: "^2.5.5"
  flutter_lints: ^6.0.0
  build_runner: "^2.16.0"
  injectable_generator: "^3.1.3"
  # Run from this directory by tools/theme_generator and by hand. The
  # runtime half of the native splash (`FlutterNativeSplash.remove()`) is
  # `platform_app_shell`'s dependency, not this app's.
  flutter_native_splash: ^2.4.8
  icons_launcher: ^3.1.0
  package_rename: ^1.10.1

flutter:
  uses-material-design: true
