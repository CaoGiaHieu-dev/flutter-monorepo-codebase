name: mobile_app
description: "Native Shell / Application Entry Point"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # composer:managed:deps — generated from app_manifest.yaml
  core_common:
    path: ../../platform/common
  core_network:
    path: ../../platform/network
  core_storage:
    path: ../../platform/storage
  core_database:
    path: ../../platform/database
  core_di:
    path: ../../platform/di
  core_notifications:
    path: ../../platform/notifications
  platform_app_shell:
    path: ../../platform/app_shell
  core_base_ui:
    path: ../../platform/base_ui
  domain_core:
    path: ../../platform/domain_core
  domain_auth:
    path: ../../modules/auth/domain
  domain_cache:
    path: ../../modules/cache/domain
  data_core:
    path: ../../platform/data_core
  data_auth:
    path: ../../modules/auth/data
  data_cache:
    path: ../../modules/cache/data
  feature_auth:
    path: ../../modules/auth/feature
  feature_home:
    path: ../../modules/home/feature
  feature_settings:
    path: ../../modules/settings/feature
  feature_onboarding:
    path: ../../modules/onboarding/feature
  feature_splash:
    path: ../../modules/splash/feature
  feature_dashboard:
    path: ../../modules/dashboard/feature
  provider_state_management:
    path: ../../platform/provider_state_management
  bloc_state_management:
    path: ../../platform/bloc_state_management
  platform_kernel:
    path: ../../platform/kernel
  core_responsive:
    path: ../../platform/responsive
  core_ui_kit:
    path: ../../platform/ui_kit
  # composer:end:deps

  # External packages this app itself uses. Everything else — the router,
  # providers, networking, logging — belongs to `platform_app_shell` and the
  # composed modules, which declare their own. This list used to name 17
  # packages left over from when the shell lived in this package; the app
  # imports two of them.
  cupertino_icons: ^1.0.9
  firebase_core: "^4.13.0"     # lib/firebase/firebase_module.dart
  injectable: ^3.0.0           # lib/di/injection.dart
  # Not imported: `tools/theme_generator` runs `dart run
  # flutter_native_splash:create` in this directory, which needs it here.
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: "^2.16.0"
  injectable_generator: "^3.1.3"
  # Run from this directory by tools/theme_generator and by hand.
  icons_launcher: ^3.1.0
  package_rename: ^1.10.1

flutter:
  uses-material-design: true
