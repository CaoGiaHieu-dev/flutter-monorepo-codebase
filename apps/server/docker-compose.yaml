version: '3.8'

services:
  postgres:
    image: postgres:16.2
    restart: unless-stopped
    ports:
      - '8090:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_server
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    restart: unless-stopped
    ports:
      - '8091:6379'

volumes:
  pgdata:
