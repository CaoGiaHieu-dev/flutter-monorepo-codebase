# Variable 'flutter-version' was defined in the Variables tab
# Variable 'flutterPath' was defined in the Variables tab
# Variable 'note' was defined in the Variables tab
# Variable 'numberBuild' was defined in the Variables tab
# Variable 'version' was defined in the Variables tab
name: $(Date:yyyyMMdd).$(Rev:r)
resources:
  repositories:
    - repository: self
      type: git
      ref: main

pool:
  name: codebase

trigger: none

stages:
  - stage: Build
    jobs:
      - job:
        displayName: Flutter Build And Upload Artifacts
        steps:
          - checkout: self
            clean: true
            fetchTags: false
          - task: Bash@3
            displayName: Get source version
            inputs:
              targetType: inline
              script: >-
                SourceVersion=$(git rev-parse HEAD)

                echo "##vso[task.setvariable variable=SourceVersionId]$SourceVersion"

                COMMAND="$(echo $SourceVersion | cut -c-7)"

                echo $COMMAND

                echo "##vso[task.setvariable variable=commitTag]$COMMAND"

          # Gitignored build inputs, restored from Pipelines -> Library ->
          # Secure files BEFORE any code generation: firebase_module.dart
          # imports all three firebase_options_*.dart files, and the
          # google-services Gradle plugin needs the flavor's JSON. This
          # pipeline builds prod only, so only prod's files are real; dev and
          # staging get a compile-only stub. DownloadSecureFile fails the run
          # when a secure file is missing from the library.
          # See docs/en/operations/01_cicd.md section 7.
          - task: DownloadSecureFile@1
            name: envProd
            displayName: "Download env.prod"
            inputs:
              secureFile: "env.prod"
              retryCount: 3

          - task: DownloadSecureFile@1
            name: firebaseOptionsProd
            displayName: "Download firebase_options_prod.dart"
            inputs:
              secureFile: "firebase_options_prod.dart"
              retryCount: 3

          - task: DownloadSecureFile@1
            name: googleServicesProd
            displayName: "Download google-services.prod.json"
            inputs:
              secureFile: "google-services.prod.json"
              retryCount: 3

          - task: Bash@3
            displayName: Restore gitignored build inputs
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                APP="$(Build.SourcesDirectory)/apps/mobile"
                cp "$(envProd.secureFilePath)" "$APP/env.prod"
                cp "$(firebaseOptionsProd.secureFilePath)" "$APP/lib/firebase/firebase_options_prod.dart"
                mkdir -p "$APP/android/app/src/prod"
                cp "$(googleServicesProd.secureFilePath)" "$APP/android/app/src/prod/google-services.json"
                for other in dev staging; do
                  file="$APP/lib/firebase/firebase_options_${other}.dart"
                  [ -f "$file" ] && continue
                  printf '%s\n' \
                    "// CI-only stub for a flavor this pipeline does not build. Never used at runtime:" \
                    "// injectable registers only the prod FirebaseOptions." \
                    "import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;" \
                    "" \
                    "class DefaultFirebaseOptions {" \
                    "  static FirebaseOptions get currentPlatform => const FirebaseOptions(" \
                    "        apiKey: 'ci-stub'," \
                    "        appId: 'ci-stub'," \
                    "        messagingSenderId: 'ci-stub'," \
                    "        projectId: 'ci-stub'," \
                    "      );" \
                    "}" > "$file"
                  echo "stubbed $file"
                done

          - task: Hey24sheep.flutter.flutter-install.FlutterInstall@0
            displayName: Flutter Install
            inputs:
              version: custom
              customVersion: $(flutter-version)

          - task: Hey24sheep.flutter.flutter-command.FlutterCommand@0
            displayName: Flutter Clean
            inputs:
              flutterDirectory: $(flutterPath)
              arguments: clean

          - task: Hey24sheep.flutter.flutter-command.FlutterCommand@0
            displayName: Flutter pub get (committed lockfile)
            inputs:
              flutterDirectory: $(flutterPath)
              # The workspace pubspec.lock is committed; fail on a stale one
              # instead of silently re-resolving it.
              arguments: pub get --enforce-lockfile

          - task: Bash@3
            displayName: Flutter Config
            inputs:
              targetType: inline
              script: |
                dart tools/workspace_setup/configure.dart

          - task: DownloadSecureFile@1
            name: keyProperties
            displayName: "Download key.properties"
            inputs:
              secureFile: "key.properties"
              retryCount: 3

          - task: CopyFiles@2
            inputs:
              SourceFolder: "$(Agent.TempDirectory)"
              Contents: key.properties
              TargetFolder: "$(Build.SourcesDirectory)/apps/mobile/android/"

          - task: DownloadSecureFile@1
            name: keystore
            displayName: "Download keystore.jks"
            inputs:
              secureFile: "keystore.jks"
              retryCount: 3

          - task: CopyFiles@2
            inputs:
              SourceFolder: "$(Agent.TempDirectory)"
              Contents: keystore.jks
              TargetFolder: "$(Build.SourcesDirectory)/apps/mobile/android/"

          - task: Hey24sheep.flutter.flutter-build.FlutterBuild@0
            displayName: Flutter Build Android
            inputs:
              target: apk
              projectDirectory: $(Build.SourcesDirectory)/apps/mobile
              flutterDirectory: $(flutterPath)
              verboseMode: true
              buildNumber: $(numberBuild)
              buildName: $(version)
              extraArgs: --flavor=prod --dart-define-from-file=$(Build.SourcesDirectory)/apps/mobile/env.prod --obfuscate --split-debug-info=$(Build.SourcesDirectory)/obfuscate/ --no-tree-shake-icons

          - task: PublishPipelineArtifact@1
            displayName: Publish Android
            inputs:
              targetPath: $(Build.SourcesDirectory)/apps/mobile/build/app/outputs/flutter-apk/app-prod-release.apk
              artifact: android

          # --obfuscate makes this build's stack traces unreadable without the
          # symbol files --split-debug-info wrote to obfuscate/, and they are
          # not inside the APK. Keep them with the build:
          #   flutter symbolize -i <stack-trace> -d <artifact>/app.android-arm64.symbols
          - task: PublishPipelineArtifact@1
            displayName: Publish obfuscation symbols
            inputs:
              targetPath: $(Build.SourcesDirectory)/obfuscate
              artifact: debug-symbols

  - stage: Distribute
    dependsOn: Build
    jobs:
      - job:
        displayName: Download Artifacts and Distribute
        steps:
          - checkout: self
            clean: true
          - task: DownloadPipelineArtifact@2
            displayName: Download Android
            inputs:
              artifact: android
              patterns: "**/*.apk"
              targetPath: $(Build.SourcesDirectory)/android-download
          # The Firebase CLI is not on the agent, and it authenticates through
          # GOOGLE_APPLICATION_CREDENTIALS: a Firebase service-account JSON
          # uploaded as the secure file `firebase-service-account.json` (the
          # same JSON as GitHub's FIREBASE_SERVICE_ACCOUNT_KEY secret). Node
          # comes from UseNode, the CLI through npx — nothing is installed
          # globally on the self-hosted agent. See docs/en/operations/01_cicd.md
          # sections 5 and 7.
          - task: UseNode@1
            displayName: Use Node.js 22 (Firebase CLI)
            inputs:
              version: "22.x"

          - task: DownloadSecureFile@1
            name: firebaseServiceAccount
            displayName: "Download firebase-service-account.json"
            inputs:
              secureFile: "firebase-service-account.json"
              retryCount: 3

          # Values reach the script through env, not macro-expanded into it,
          # so quotes in the release note cannot break the command. `test` is
          # the tester group alias; it must exist in Firebase App
          # Distribution — change it here to invite another group.
          - task: Bash@3
            displayName: "Deploy Android to Firebase"
            inputs:
              targetType: inline
              workingDirectory: $(Build.SourcesDirectory)/android-download
              script: |
                set -euo pipefail
                printf '%s\n' "$RELEASE_NOTES" > "$(Agent.TempDirectory)/release-notes.txt"
                npx --yes firebase-tools@15 appdistribution:distribute app-prod-release.apk \
                  --app "$FIREBASE_APP_ID" \
                  --release-notes-file "$(Agent.TempDirectory)/release-notes.txt" \
                  --groups "test"
            env:
              GOOGLE_APPLICATION_CREDENTIALS: $(firebaseServiceAccount.secureFilePath)
              FIREBASE_APP_ID: $(FIREBASE-ANDROID-ID)
              RELEASE_NOTES: $(note)
