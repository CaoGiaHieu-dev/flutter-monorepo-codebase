targets:
  $default:
    builders:
      injectable_generator:injectable_builder:
        options:
          # `auto_register` lets each package's `@InjectableInit.microPackage()`
          # pick up its own annotations. No `generate_for` here on purpose: this
          # is the root workspace package, it has no `lib/`, and every real
          # entry point (`apps/mobile/lib/di/injection.dart`, each package's
          # `lib/di/module.dart`) is discovered by the builder itself.
          auto_register: true
      retrofit_generator:
        options:
          nullToAbsent: true
      json_serializable:
        options:
          # Options configure how source code is generated for every
          # `@JsonSerializable`-annotated class in the package.
          #
          # The default value for each is listed.
          any_map: true
          checked: false
          constructor: ""
          create_factory: true
          create_field_map: false
          create_per_field_to_json: false
          create_to_json: true
          disallow_unrecognized_keys: false
          explicit_to_json: false
          field_rename: none
          generic_argument_factories: false
          ignore_unannotated: false
          include_if_null: false
