name: data_cache
description: "Sample module: a Drift-backed key-value cache — data layer"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_database:
    path: ../../../platform/infra/database
  domain_core:
    path: ../../../platform/layers/domain
  domain_cache:
    path: ../domain
  data_core:
    path: ../../../platform/layers/data
  drift: "^2.34.3"
  get_it: ^9.2.1
  injectable: ^3.0.0
  freezed_annotation: "^3.1.0"

dev_dependencies:
  build_runner: "^2.16.0"
  drift_dev: "^2.34.5"
  injectable_generator: "^3.1.3"
  freezed: "^4.0.0-dev.3"
  flutter_test:
    sdk: flutter
