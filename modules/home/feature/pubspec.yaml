name: feature_home
description: "Module feature_home for codebase_template"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

dependencies:
  material_ui: ^1.1.1
  core_di:
    path: ../../../platform/foundation/contracts
  home_api:
    path: ../api
  flutter:
    sdk: flutter
  core_common:
    path: ../../../platform/foundation/common
  core_base_ui:
    path: ../../../platform/ui/design_system
  bloc_state_management:
    path: ../../../platform/state/bloc
  flutter_bloc: "^9.1.1"

  injectable: ^3.0.0
  go_router: "^18.0.0"
  freezed_annotation: "^3.1.0"
  flutter_localizations:
    sdk: flutter
  intl: "^0.20.3"
dev_dependencies:
  build_runner: "^2.16.0"
  go_router_builder: "^4.4.0"
  injectable_generator: "^3.1.3"
  freezed: "^4.0.0-dev.3"
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
