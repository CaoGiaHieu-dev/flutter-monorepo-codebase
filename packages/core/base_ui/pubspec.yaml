name: core_base_ui
description: "Central UI Kit, Theme System, Assets, and Translations for codebase_template"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  core_di:
    path: ../di
  core_common:
    path: ../common

dev_dependencies:
  build_runner: "^2.15.1"
  flutter_gen_runner: ^5.14.1
  injectable_generator: "^3.0.2"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/src/gen/
  assets:
    outputs:
      class_name: Assets
      package_parameter_enabled: true
      style: "dot-delimiter"
  integrations:
    flutter_svg: true
