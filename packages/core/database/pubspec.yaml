name: core_database
description: "Local relational database using Drift with background isolate for codebase_template"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  drift: "^2.34.3"
  path_provider: "^2.1.5"
  path: "^1.9.1"
  get_it: ^9.2.1
  injectable: ^3.0.0
  core_common:
    path: ../common

dev_dependencies:
  build_runner: "^2.15.1"
  drift_dev: "^2.34.5"
  injectable_generator: "^3.0.2"
  flutter_test:
    sdk: flutter
