name: core_database
description: "Local relational database using Drift with background isolate for codebase_template"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.1 <4.0.0"
  flutter: ">=3.47.1"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  drift: "^2.34.3"
  path_provider: "^2.1.6"
  path: "^1.9.1"
  get_it: ^9.2.1
  injectable: ^3.0.0

dev_dependencies:
  build_runner: "^2.16.0"
  drift_dev: "^2.34.5"
  injectable_generator: "^3.1.3"
  flutter_test:
    sdk: flutter
