name: core_network
description: "Network service wrapper using Dio and Retrofit for codebase_template"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.1 <4.0.0"
  flutter: ">=3.47.2"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dio: "^5.11.0"
  retrofit: "^4.10.0"
  get_it: ^9.2.1
  injectable: ^3.0.0
  core_common:
    path: ../common
  dynamic_logger: "^0.5.0"

dev_dependencies:
  build_runner: "^2.16.0"
  retrofit_generator: "^10.2.8"
  injectable_generator: "^3.1.3"
  flutter_test:
    sdk: flutter
