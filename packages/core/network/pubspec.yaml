name: core_network
description: "Network service wrapper using Dio and Retrofit for codebase_template"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dio: "^5.11.0"
  retrofit: ^4.9.2
  get_it: ^9.2.1
  injectable: ^3.0.0
  core_common:
    path: ../common

dev_dependencies:
  build_runner: "^2.15.1"
  retrofit_generator: "^10.2.7"
  injectable_generator: "^3.0.2"
  flutter_test:
    sdk: flutter
