name: core_notifications
description: "Push notification management system using Firebase Messaging for codebase_template"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.1 <4.0.0"
  flutter: ">=3.47.2"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  firebase_core: "^4.13.0"
  firebase_messaging: "^16.5.0"
  flutter_local_notifications: "^22.3.0"
  get_it: ^9.2.1
  injectable: ^3.0.0
  core_common:
    path: ../common
  dynamic_logger: "^0.5.0"

dev_dependencies:
  build_runner: "^2.16.0"
  injectable_generator: "^3.1.3"
