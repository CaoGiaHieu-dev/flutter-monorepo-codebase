name: core_notifications
description: "Push notification management system using Firebase Messaging for codebase_template"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  firebase_core: "^4.11.0"
  firebase_messaging: "^16.2.1"
  flutter_local_notifications: "^22.0.1"
  get_it: ^9.2.1
  injectable: ^3.0.0
  core_common:
    path: ../common

dev_dependencies:
  build_runner: "^2.15.1"
  injectable_generator: "^3.0.2"
