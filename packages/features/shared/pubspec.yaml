version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_common:
    path: ../../core/common
  core_base_ui:
    path: ../../core/base_ui
  provider_state_management:
    path: ../../core/provider_state_management
  get_it: ^9.2.1
  injectable: ^3.0.0
  cached_network_image_ce: ^4.9.0
  extended_image: ^10.0.1
  photo_manager: ^3.9.0
