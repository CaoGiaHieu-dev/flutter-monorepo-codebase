  dotted_line: ^3.2.3
  permission_handler: ^12.0.1
  device_info_plus: ^13.1.0
  gradient_borders: "^1.0.2"
  jumping_dot: "^0.0.7"
  refresh_sticky: "^0.1.2"
  flutter_screenutil: ^5.9.3

dev_dependencies:
  build_runner: "^2.15.1"
  injectable_generator: "^3.0.2"

flutter:
  generate: true
