name: core_notifications
description: "Push notification management system using Firebase Messaging"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

# Read by `composer` (`describe`, the app report); pub ignores `composition:`.
# The package declares no `platforms:`: it links on every platform.
# `push_platforms` is where Firebase Messaging delivers, read by composer V8
# and the push derivation; `app_provides` is what an app that composes this
# package must register itself.
composition:
  push_platforms: [android, ios, macos, web]
  app_provides:
    FirebaseOptions:
      per_flavor: true # an @Environment('<flavor>') registration for every declared flavor
      hint: "apps/<id>/lib/firebase/firebase_module.dart, written by dart tools/firebase/firebase_config.dart. Native, not checked: google-services.json per Android flavor; aps-environment on iOS"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: "^4.13.0"
  firebase_messaging: "^16.5.0"
  flutter_local_notifications: "^22.3.0"
  injectable: ^3.0.0
  platform_kernel:
    path: ../../foundation/kernel
  dynamic_logger: "^0.5.0"

dev_dependencies:
  build_runner: "^2.16.0"
  injectable_generator: "^3.1.3"
  # Firebase core test API (`firebase_core_platform_interface/test.dart`), so
  # a test can run `init()` to the local-notifications plugin.
  firebase_core_platform_interface: "^8.1.1"
  flutter_test:
    sdk: flutter
