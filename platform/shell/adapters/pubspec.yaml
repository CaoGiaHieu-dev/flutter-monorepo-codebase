name: platform_shell_adapters
description: "The app shell's infrastructure adapters: NetworkConfig, the ILanguageStorage / IThemeStorage storage adapters and the AppBootStorage boot flag. Every app composes it, next to platform_app_shell."
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

# Shell group (`platform/shell/`): may depend on any other platform group,
# never on `modules/` (arch_check R1). The ui group is here for two things —
# `core_ui_kit`'s `RetryDialog`, which `NetworkConfigImpl.onRetryCallback`
# shows when a request times out, and `core_base_ui`'s `AppLanguages`, which
# resolves the `language` header. `platform_app_shell` depends on this
# package, never the other way round.
dependencies:
  flutter:
    sdk: flutter
  core_base_ui:
    path: ../../ui/design_system
  core_common:
    path: ../../foundation/common
  core_di:
    path: ../../foundation/contracts
  core_network:
    path: ../../infra/network
  core_storage:
    path: ../../infra/storage
  core_ui_kit:
    path: ../../ui/ui_kit
  material_ui: "^1.1.1"
  injectable: "^3.0.0"

dev_dependencies:
  build_runner: "^2.16.0"
  injectable_generator: "^3.1.3"
  flutter_test:
    sdk: flutter
