name: platform_app_shell
description: "The reusable app shell: boot scope, router assembly, material wrapper, and the app-level DI adapters. Every app under apps/ composes this rather than copying it."
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_base_ui:
    path: ../../ui/design_system
  core_common:
    path: ../../foundation/common
  core_di:
    path: ../../foundation/contracts
  core_network:
    path: ../../infra/network
  core_responsive:
    path: ../../ui/responsive
  core_storage:
    path: ../../infra/storage
  core_ui_kit:
    path: ../../ui/ui_kit
  provider_state_management:
    path: ../../state/provider
  material_ui: "^1.1.1"
  go_router: "^18.0.0"
  get_it: "^9.2.1"
  injectable: "^3.0.0"
  flutter_native_splash: "^2.4.8"
  dynamic_logger: "^0.5.0"
  app_links: "^7.2.1"

dev_dependencies:
  build_runner: "^2.16.0"
  injectable_generator: "^3.1.3"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
