name: core_base_ui
description: "Central UI Kit, Theme System, Assets, and Translations for codebase_template"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.1
  flutter_localizations:
    sdk: flutter
  core_responsive:
    path: ../responsive
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  core_di:
    path: ../../foundation/contracts
  core_common:
    path: ../../foundation/common
  cupertino_ui: "^1.0.2"
  intl: "^0.20.3"
dev_dependencies:
  build_runner: "^2.16.0"
  flutter_gen_runner: "^5.15.0"
  injectable_generator: "^3.1.3"
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    # Shipped with the font, as its licence requires; registered with
    # LicenseRegistry by `registerBaseUiLicenses()`.
    - assets/fonts/plus_jakarta_sans/OFL.txt
  # Bundled, one family with a file per weight: Flutter picks the file that
  # matches a style's fontWeight, so bold text is the real bold face — not
  # regular synthesised bold — and no font is downloaded at runtime.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700

flutter_gen:
  output: lib/src/gen/
  assets:
    outputs:
      class_name: Assets
      package_parameter_enabled: true
      style: "dot-delimiter"
  fonts:
    outputs:
      # Prefix the family with `packages/core_base_ui/`: a font declared by
      # a package resolves only under that name in the app.
      package_parameter_enabled: true
  integrations:
    flutter_svg: true
