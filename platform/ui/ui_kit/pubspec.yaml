name: core_ui_kit
description: "Shared, feature-agnostic UI widget kit"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.1
  core_base_ui:
    path: ../design_system
  injectable: ^3.0.0
  cached_network_image_ce: "^4.10.0"
  core_responsive:
    path: ../responsive
  cupertino_ui: "^1.0.2"
  dynamic_logger: "^0.5.0"
dev_dependencies:
  go_router: "^18.0.0"
  build_runner: "^2.16.0"
  injectable_generator: "^3.1.3"
  flutter_test:
    sdk: flutter

flutter:
  generate: true
