name: core_ui_kit
description: "Shared, feature-agnostic UI widget kit"
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.1
  core_common:
    path: ../common
  core_base_ui:
    path: ../base_ui
  provider_state_management:
    path: ../provider_state_management
  get_it: ^9.2.1
  injectable: ^3.0.0
  cached_network_image_ce: "^4.10.0"
  dotted_line: "^3.3.0"
  gradient_borders: "^1.0.4"
  jumping_dot: "^0.0.7"
  refresh_sticky: "^0.1.2"
  core_responsive:
    path: ../responsive

  cupertino_ui: "^1.0.2"
dev_dependencies:
  build_runner: "^2.16.0"
  injectable_generator: "^3.1.3"

flutter:
  generate: true
