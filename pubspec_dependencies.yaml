# Source of Truth for shared package versions across the entire monorepo.
# Running `dart tools/dependency_sync.dart` will synchronize these versions to all pubspec.yaml files.
#
# Toolchain baseline: Flutter 3.47.0 / Dart 3.13.3

dependencies:
  # State Management
  #
  # No `equatable`: every value type here is Freezed, which generates `==` and
  # `hashCode` itself. The pin sat in this file with no package declaring it.
  flutter_bloc: "^9.1.1"
  provider: "^6.1.5+1"

  # Dependency Injection
  get_it: "^9.2.1"
  injectable: "^3.0.0"

  # Networking & HTTP client
  dio: "^5.11.0"
  http_security_pinning: "^1.0.1"
  retrofit: "^4.10.0"

  # Navigation & Routing
  go_router: "^18.0.0"
  app_links: "^7.2.1"

  # Code Generation Annotations
  freezed_annotation: "^3.1.0"
  json_annotation: "^4.12.0"

  # Firebase & Push Notifications
  #
  # `cloud_firestore`, `firebase_auth`, `flutter_facebook_auth` and
  # `google_sign_in` were pinned here for an auth sample that no longer uses
  # them. A catalog entry nothing declares is a version this repo claims to
  # manage and never resolves — `check_outdated.dart` reports on it forever.
  # Add the pin back alongside the dependency, not ahead of it.
  firebase_core: "^4.13.0"
  firebase_messaging: "^16.5.0"
  flutter_local_notifications: "^22.3.0"

  # Media & Image Processing
  cached_network_image_ce: "^4.10.0"

  # App Info
  package_info_plus: "^10.2.1"

  # UI Components & Styling
  material_ui: "^1.1.1"
  cupertino_ui: "^1.0.2"
  flutter_native_splash: "^2.4.8"
  flutter_svg: "^2.3.0"

  # Utilities
  email_validator: "^3.0.0"
  internet_connection_checker_plus: "^3.1.1"
  dynamic_logger: "^0.5.0"
  intl: "^0.20.3"
  path: "^1.9.1"
  path_provider: "^2.1.6"

  # Local Storage (Key-Value / Secure)
  encrypt: "^5.0.3"
  flutter_secure_storage: "11.2.0"
  shared_preferences: "^2.5.5"

  # Local Database (Drift + SQLite)
  drift: "^2.34.3"
  sqlite3: "^3.6.0"   # core_database: per-connection setup for the read pool

dev_dependencies:
  # Build Runner & Code Generators
  build_runner: "^2.16.0"
  freezed: "^4.0.0-dev.3"
  go_router_builder: "^4.4.0"
  injectable_generator: "^3.1.3"
  json_serializable: "^6.14.1"
  retrofit_generator: "^10.2.8"
  drift_dev: "^2.34.5"
  flutter_gen_runner: "^5.15.0"
  flutter_lints: "^6.0.0"

  # Testing — `package:test` for pure-Dart packages (tools/, domain_core);
  # Flutter packages use the SDK's `flutter_test` instead. The exact version
  # must agree with the `test_api` that `flutter_test` pins.
  test: "^1.31.1"
  # `setupFirebaseCoreMocks()` (its `test.dart`) for apps/mobile's DI smoke
  # test. Bump it together with `firebase_core`, whose interface it is.
  firebase_core_platform_interface: "^8.1.1"

  # Release Tooling
  icons_launcher: "^3.1.0"
  package_rename: "^1.10.1"
