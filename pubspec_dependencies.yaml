# Source of Truth for shared package versions across the entire monorepo.
# Running `dart tools/dependency_sync.dart` will synchronize these versions to all pubspec.yaml files.
#
# Toolchain baseline: Flutter 3.47.0 / Dart 3.13.0

dependencies:
  # State Management
  equatable: "^2.1.0"
  flutter_bloc: "^9.1.1"
  provider: "^6.1.5+1"

  # Dependency Injection
  get_it: "^9.2.1"
  injectable: "^3.0.0"

  # Networking & HTTP client
  dio: "^5.11.0"
  http_security_pinning: "^1.0.1"
  retrofit: "^4.10.0"

  # Navigation & Routing
  go_router: "^17.5.0"
  app_links: "^7.2.1"

  # Code Generation Annotations
  freezed_annotation: "^3.1.0"
  json_annotation: "^4.12.0"

  # Firebase & Push Notifications
  cloud_firestore: "^6.8.0"
  firebase_auth: "^6.5.7"
  firebase_core: "^4.13.0"
  firebase_messaging: "^16.5.0"
  flutter_local_notifications: "^22.3.0"

  # Authentication Providers
  flutter_facebook_auth: "^7.2.0"
  google_sign_in: "^7.2.0"

  # Media & Image Processing
  cached_network_image_ce: "^4.10.0"
  extended_image: "^10.1.0"
  image_picker: "^1.2.3"
  photo_manager: "^3.12.0"

  # Device Info & Permissions
  device_info_plus: "^13.2.0"
  package_info_plus: "^10.2.1"
  permission_handler: "^13.0.1"

  # UI Components & Styling
  cupertino_icons: "^1.0.9"
  dotted_line: "^3.3.0"
  flutter_native_splash: "^2.4.8"
  flutter_screenutil: "^5.9.3"
  flutter_svg: "^2.3.0"
  google_fonts: "^8.2.1"
  gradient_borders: "^1.0.4"
  jumping_dot: "^0.0.7"
  refresh_sticky: "^0.1.2"

  # Utilities
  email_validator: "^3.0.0"
  internet_connection_checker_plus: "^3.1.1"
  dynamic_logger: "^0.5.0"
  intl: "^0.20.3"
  path: "^1.9.1"
  path_provider: "^2.1.6"
  uuid: "^4.6.0"

  # Local Storage (Key-Value / Secure)
  encrypt: "^5.0.3"
  # Held at 10.x: flutter_facebook_auth -> facebook_auth_desktop still pins
  # flutter_secure_storage ^10.3.1. Bump to ^11.0.0 once that transitive
  # constraint is relaxed upstream.
  flutter_secure_storage: "^10.3.1"
  shared_preferences: "^2.5.5"

  # Local Database (Drift + SQLite)
  drift: "^2.34.3"

dev_dependencies:
  # Build Runner & Code Generators
  build_runner: "^2.16.0"
  freezed: "^4.0.0-dev.3"
  go_router_builder: "^4.4.0"
  injectable_generator: "^3.1.3"
  json_serializable: "^6.14.1"
  retrofit_generator: "^10.2.8"
  drift_dev: "^2.34.5"
  flutter_gen_runner: "^5.15.0"
  flutter_lints: "^6.0.0"

  # Release Tooling
  icons_launcher: "^3.1.0"
  package_rename: "^1.10.1"
