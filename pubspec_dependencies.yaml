# Source of Truth for shared package versions across the entire monorepo.
# Running `dart tools/dependency_sync.dart` will synchronize these versions to all pubspec.yaml files.

dependencies:
  # State Management
  equatable: "^2.1.0"
  flutter_bloc: "^9.1.1"
  provider: "^6.1.5+1"

  # Dependency Injection
  get_it: "^9.2.1"
  injectable: "^3.0.0"

  # Networking & HTTP client
  dio: "^5.11.0"
  http_security_pinning: "^1.0.1"
  retrofit: "^4.9.2"

  # Navigation & Routing
  go_router: "^17.3.0"

  # Code Generation Annotations
  freezed_annotation: "^3.1.0"
  json_annotation: "^4.12.0"

  # Firebase & Push Notifications
  cloud_firestore: "^6.6.0"
  firebase_auth: "^6.5.3"
  firebase_core: "^4.11.0"
  firebase_messaging: "^16.2.1"
  flutter_local_notifications: "^22.0.1"

