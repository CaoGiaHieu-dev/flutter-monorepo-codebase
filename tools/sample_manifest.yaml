# Sample vs framework manifest — the single source of truth for "what can I delete?"
#
# This template ships working reference features. They exist to show how the
# architecture is wired, not because your product needs them. Nothing here is
# derivable from the folder layout alone: `platform/domain_core` is framework
# while `modules/auth/domain` is a sample, and both live under `modules/*/domain/`.
#
# YAML rather than JSON on purpose: this file is read by humans first and by
# `tools/sample_cleanup/remove_sample.dart` second, and JSON cannot carry the
# comments that make the classification defensible. `yaml: ^3.1.3` is already a
# dependency of `tools/`, so parsing costs nothing.
#
# Usage:
#   dart tools/sample_cleanup/remove_sample.dart --list
#   dart tools/sample_cleanup/remove_sample.dart auth --dry-run
#   dart tools/sample_cleanup/remove_sample.dart auth --apply

# ---------------------------------------------------------------------------
# Classification
# ---------------------------------------------------------------------------
# kind: framework | sample | shell
#   framework — infrastructure. Keep. Deleting breaks the template.
#   sample    — reference implementation. Delete freely once you understand it.
#   shell     — an app. Keep, but you edit its manifest whenever you add/remove a feature.

packages:
  # --- Framework: core infrastructure -------------------------------------
  platform_kernel: { kind: framework, path: platform/kernel }
  platform_app_shell: { kind: framework, path: platform/app_shell }
  core_common: { kind: framework, path: platform/common }
  core_di: { kind: framework, path: platform/di }
  core_base_ui: { kind: framework, path: platform/base_ui }
  core_network: { kind: framework, path: platform/network }
  core_storage: { kind: framework, path: platform/storage }
  core_database: { kind: framework, path: platform/database }
  core_notifications: { kind: framework, path: platform/notifications }
  core_ui_kit: { kind: framework, path: platform/ui_kit }
  provider_state_management:
    { kind: framework, path: platform/provider_state_management }
  bloc_state_management:
    { kind: framework, path: platform/bloc_state_management }

  # --- Framework: layer foundations ---------------------------------------
  # These carry the base contracts every domain/data package builds on
  # (Result<T>, BaseEntity, IBaseRepository). They also happen to contain the
  # cache sample — see `embedded_samples` below.
  domain_core: { kind: framework, path: platform/domain_core }
  data_core: { kind: framework, path: platform/data_core }

  # --- Shell ---------------------------------------------------------------
  mobile_app:
    kind: shell
    path: apps/mobile
    note: >-
      Keep. Its `lib/di/injection.dart` names every module it composes — that
      is the one intentional hard reference from shell to modules. It is
      generated: to add or remove a module, edit `app_manifest.yaml` and run
      `dart tools/composer/composer.dart sync`, never the file itself.
  admin_app:
    kind: shell
    path: apps/admin
    note: >-
      The second app: auth + settings, and no dashboard, splash, onboarding,
      home or Firebase. It keeps every optional lookup in platform_app_shell
      exercised by a real composition. Removing a bundle edits its manifest too.

  # --- Samples: features ---------------------------------------------------
  feature_auth:
    kind: sample
    path: modules/auth/feature
    demonstrates: >-
      Provider state management, a global @lazySingleton controller,
      cross-module contracts (agnostic streams, action handlers, the session
      gateway the transport layer reads), and route-level DI. One screen only
      (login) — register and forgot-password repeated the same mechanisms
      with different strings.

  feature_home:
    kind: sample
    path: modules/home/feature
    demonstrates: >-
      BLoC with private Freezed events, a dashboard tab (INavDestinationModule),
      and consuming another feature's state through a core_di contract.

  feature_settings:
    kind: sample
    path: modules/settings/feature
    demonstrates: >-
      A second dashboard tab, theme/locale switching that bypasses Domain, and
      triggering another feature's action through an action handler.

  feature_onboarding:
    kind: sample
    path: modules/onboarding/feature
    demonstrates: >-
      A stack route (IFeatureRouteModule) and the cold-start entry point
      (IAppEntryLocation).

  feature_dashboard:
    kind: sample
    path: modules/dashboard/feature
    demonstrates: >-
      Shell chrome only — builds the bottom bar from whatever tabs register
      themselves. Owns no business logic and no tab page.

  feature_splash:
    kind: sample
    path: modules/splash/feature
    demonstrates: >-
      Supplying the boot splash screen to the app shell through
      IAppSplashScreen.

  # --- Samples: domain/data pairs -----------------------------------------
  domain_auth:
    kind: sample
    path: modules/auth/domain
    demonstrates: Pure-Dart entities, params, repository contract and use cases.
  data_auth:
    kind: sample
    path: modules/auth/data
    demonstrates: >-
      A Retrofit data source, Freezed models with .toEntity(), a
      package-owned storage key, and a repository wrapping both in execute()
      so nothing throws past the data layer.

# ---------------------------------------------------------------------------
# Samples living inside framework packages
# ---------------------------------------------------------------------------
# These cannot be removed by deleting a package, because the package around
# them is framework. Delete the listed files instead.

embedded_samples:
  cache_chain:
    lives_in: [domain_core, data_core]
    demonstrates: >-
      One complete vertical slice — table, DAO, data source, repository,
      entity, use cases — as a copy-me template for your first real table.
    warning: >-
      Nothing in the app consumes it. `unused_checker` will not flag it because
      it is registered in DI, and the tests use it as a fixture, so it looks
      alive. It is not.
    files:
      - platform/domain_core/lib/src/entities/cache_entry_entity.dart
      - platform/domain_core/lib/src/params/cache_entry_params.dart
      - platform/domain_core/lib/src/repositories/i_cache_entry_repository.dart
      - platform/domain_core/lib/src/usecases/get_cache_entry_usecase.dart
      - platform/domain_core/lib/src/usecases/get_all_cache_entries_usecase.dart
      - platform/domain_core/lib/src/usecases/save_cache_entry_usecase.dart
      - platform/data_core/lib/src/database/cache_database.dart
      - platform/data_core/lib/src/database/tables/cache_entries_table.dart
      - platform/data_core/lib/src/database/dao/cache_entries_dao.dart
      - platform/data_core/lib/src/models/cache_entry_model.dart
      - platform/data_core/lib/src/data_sources/local/cache_entry_local_data_source.dart
      - platform/data_core/lib/src/repositories_impl/cache_entry_repository_impl.dart
    also_remove:
      - platform/data_core/test/cache_database_test.dart
      - platform/data_core/test/database_handle_test.dart

  auth_rest_reference:
    lives_in: [data_auth]
    demonstrates: A Retrofit remote data source over the endpoints in utils/.
    warning: >-
      Dead in the running app — AuthRepositoryImpl talks to the Firebase SDK
      directly and never calls it. Kept as a REST reference.
    files:
      - modules/auth/data/lib/src/data_sources/remote/auth_remote_data_source.dart
      - modules/auth/data/lib/src/utils/auth_api_constants.dart

# ---------------------------------------------------------------------------
# Removal bundles
# ---------------------------------------------------------------------------
# A "feature" is never just its feature package. Each bundle lists everything
# that travels with it. `breaks` records samples that stop working when this
# bundle is removed — the part no document covered before.

bundles:
  auth:
    packages: [feature_auth, domain_auth, data_auth]
    # Contracts declared in core_di purely so this feature could publish state
    # across the boundary. They become dead declarations once it is gone.
    orphaned_contracts:
      - platform/di/lib/src/agnostic_streams/i_auth_status_stream.dart
      - platform/di/lib/src/agnostic_streams/i_auth_session_state.dart
      - platform/di/lib/src/agnostic_streams/i_auth_refresh_listenable.dart
      - platform/di/lib/src/agnostic_streams/auth_session_failure.dart
      - platform/di/lib/src/actions/i_auth_action_handler.dart
      - platform/di/lib/src/navigators/auth_navigator.dart
    orphaned_keys:
      - "NavigatorKeys.nested('auth') in platform/di/lib/src/routing/navigator_keys.dart"
    breaks:
      - sample: feature_home
        at: modules/home/feature/lib/src/bloc/home_profile_bloc.dart:25
        why: >-
          HomeProfileBloc takes IAuthStatusStream through the constructor, so
          DI cannot build it at all once nothing registers that contract.
        fix: Drop the dependency from the bloc, or remove feature_home too.
    safe_couplings:
      - "feature_onboarding -> AuthNavigator (getItOrNull + fallback, degrades quietly)"
      - "feature_settings -> IAuthActionHandler (getItOrNull; the logout row is hidden)"

  home:
    packages: [feature_home]
    orphaned_contracts:
      - platform/di/lib/src/navigators/home_navigator.dart
    breaks: []
    safe_couplings:
      - "feature_auth -> HomeNavigator (getItOrNull + fallback, degrades quietly)"
    note: >-
      Removing every INavDestinationModule leaves the dashboard with no tabs;
      AppRouter falls back to an empty branch rather than crashing.

  settings:
    packages: [feature_settings]
    orphaned_contracts:
      - platform/di/lib/src/navigators/settings_navigator.dart
    breaks: []

  onboarding:
    packages: [feature_onboarding]
    orphaned_contracts:
      - platform/di/lib/src/navigators/onboarding_navigator.dart
    breaks: []
    note: >-
      This is the only IAppEntryLocation. Without it the cold-start route falls
      back to the first dashboard tab, then to '/'.

  dashboard:
    packages: [feature_dashboard]
    orphaned_contracts:
      - platform/di/lib/src/routing/dashboard_route_module.dart
    breaks: []
    note: >-
      Tabs registered by other features have nothing to render into. Remove the
      tab features as well, or supply your own DashboardRouteModule.

  splash:
    packages: [feature_splash]
    orphaned_contracts:
      - platform/di/lib/src/app/i_app_splash_screen.dart
    breaks: []
    note: >-
      runShellApp (platform_app_shell) resolves it with getItOrNull, so the
      app simply keeps the native splash until the first frame.

# ---------------------------------------------------------------------------
# Shared files every bundle removal edits
# ---------------------------------------------------------------------------
# Documentation only: remove_sample.dart computes the list from every
# app_manifest.yaml it finds, so a new app is covered without editing this.
shared_files:
  - pubspec.yaml # workspace: entry per package
  - apps/<id>/app_manifest.yaml # modules: entry per bundle — the source of truth
  - apps/<id>/pubspec.yaml # generated dependency entry per package
  - apps/<id>/lib/di/injection.dart # generated import + ExternalModule entry

# Contracts that survive every removal: they are generic mechanisms, not
# feature-specific. Do not delete these while chasing orphans.
framework_contracts:
  - platform/di/lib/src/routing/routing_interfaces.dart # IFeatureRouteModule
  - platform/di/lib/src/routing/i_nav_destination_module.dart
  - platform/di/lib/src/routing/i_app_entry_location.dart
  - platform/di/lib/src/routing/navigator_keys.dart
  - platform/di/lib/src/feature_localization.dart
  - platform/di/lib/src/theme/i_theme_storage.dart
  - platform/di/lib/src/language/i_language_storage.dart
  - platform/di/lib/src/app/i_app_tree_wrapper.dart
