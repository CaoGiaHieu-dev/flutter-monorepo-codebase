# Sample vs framework manifest — the single source of truth for "what can I delete?"
#
# This template ships working reference features. They exist to show how the
# architecture is wired, not because your product needs them. Nothing here is
# derivable from the folder layout alone: `platform/layers/domain` is framework
# while `modules/auth/domain` is a sample, and both are folders named `domain/`.
#
# YAML rather than JSON on purpose: this file is read by humans first and by
# `tools/sample_cleanup/remove_sample.dart` second, and JSON cannot carry the
# comments that make the classification defensible. `yaml: ^3.1.3` is already a
# dependency of `tools/`, so parsing costs nothing.
#
# Usage:
#   dart tools/sample_cleanup/remove_sample.dart --list
#   dart tools/sample_cleanup/remove_sample.dart auth            # dry run (default)
#   dart tools/sample_cleanup/remove_sample.dart auth --apply

# ---------------------------------------------------------------------------
# Classification
# ---------------------------------------------------------------------------
# kind: framework | sample | shell
#   framework — infrastructure. Keep. Deleting breaks the template.
#   sample    — reference implementation. Delete freely once you understand it.
#   shell     — an app. Keep, but you edit its manifest whenever you add/remove a feature.

packages:
  # --- Framework: core infrastructure -------------------------------------
  platform_kernel: { kind: framework, path: platform/foundation/kernel }
  platform_app_shell: { kind: framework, path: platform/shell/app_shell }
  platform_shell_adapters: { kind: framework, path: platform/shell/adapters }
  core_common: { kind: framework, path: platform/foundation/common }
  core_di: { kind: framework, path: platform/foundation/contracts }
  core_base_ui: { kind: framework, path: platform/ui/design_system }
  core_network: { kind: framework, path: platform/infra/network }
  core_storage: { kind: framework, path: platform/infra/storage }
  core_database: { kind: framework, path: platform/infra/database }
  core_notifications: { kind: framework, path: platform/infra/notifications }
  core_ui_kit: { kind: framework, path: platform/ui/ui_kit }
  core_responsive: { kind: framework, path: platform/ui/responsive }
  provider_state_management:
    { kind: framework, path: platform/state/provider }
  bloc_state_management:
    { kind: framework, path: platform/state/bloc }

  # --- Framework: layer foundations ---------------------------------------
  # These carry the base contracts every domain/data package builds on
  # (Result<T>, BaseEntity, IBaseRepository). They contain no sample code: the
  # Drift example that used to live inside them is the `cache` module now.
  domain_core: { kind: framework, path: platform/layers/domain }
  data_core: { kind: framework, path: platform/layers/data }

  # --- Shell ---------------------------------------------------------------
  mobile_app:
    kind: shell
    path: apps/mobile
    note: >-
      Keep. Its `lib/di/injection.dart` names every module it composes — that
      is the one intentional hard reference from shell to modules. It is
      generated: to add or remove a module, edit `app_manifest.yaml` and run
      `dart tools/composer/composer.dart sync`, never the file itself.
  admin_app:
    kind: shell
    path: apps/admin
    note: >-
      The second app: auth + settings, and no dashboard, splash, onboarding,
      home or Firebase. It keeps every optional lookup in platform_app_shell
      exercised by a real composition. Removing a bundle edits its manifest too.

  # --- Samples: features ---------------------------------------------------
  feature_auth:
    kind: sample
    path: modules/auth/feature
    demonstrates: >-
      Provider state management, a global @lazySingleton controller,
      cross-module contracts (agnostic streams, action handlers, the session
      gateway the transport layer reads), and route-level DI. One screen only
      (login) — register and forgot-password repeated the same mechanisms
      with different strings.

  feature_home:
    kind: sample
    path: modules/home/feature
    demonstrates: >-
      BLoC with private Freezed events, a dashboard tab (INavDestinationModule),
      and consuming another feature's state through a core_di contract.

  feature_settings:
    kind: sample
    path: modules/settings/feature
    demonstrates: >-
      A second dashboard tab, theme/locale switching that bypasses Domain, and
      triggering another feature's action through an action handler.

  feature_onboarding:
    kind: sample
    path: modules/onboarding/feature
    demonstrates: >-
      A stack route (IFeatureRouteModule) and the cold-start entry point
      (IAppEntryLocation).

  feature_dashboard:
    kind: sample
    path: modules/dashboard/feature
    demonstrates: >-
      Shell chrome only — builds the bottom bar from whatever tabs register
      themselves. Owns no business logic and no tab page.

  feature_splash:
    kind: sample
    path: modules/splash/feature
    demonstrates: >-
      Supplying the boot splash screen to the app shell through
      IAppSplashScreen.

  # --- Samples: domain/data pairs -----------------------------------------
  domain_auth:
    kind: sample
    path: modules/auth/domain
    demonstrates: Pure-Dart entities, params, repository contract and use cases.
  data_auth:
    kind: sample
    path: modules/auth/data
    demonstrates: >-
      A Retrofit data source, Freezed models with .toEntity(), a
      package-owned storage key, and a repository wrapping both in execute()
      so nothing throws past the data layer.
  domain_cache:
    kind: sample
    path: modules/cache/domain
    demonstrates: The domain half of a locally persisted slice — entity, params, contract, two use cases.
  data_cache:
    kind: sample
    path: modules/cache/data
    demonstrates: >-
      A package-owned Drift database — table, DAO, migrations through
      core_database — behind IDatabaseHandle, with a Model that keeps Drift's
      row type out of the public API. Its tests are the fixture for
      core_database's DatabaseHandle and driftMigrationStrategy.

# ---------------------------------------------------------------------------
# Removal bundles
# ---------------------------------------------------------------------------
# A "feature" is never just its feature package. Each bundle lists everything
# that travels with it. `breaks` records samples that stop working when this
# bundle is removed — the part no document covered before.

bundles:
  auth:
    packages: [feature_auth, domain_auth, data_auth]
    # Contracts declared in core_di purely so this feature could publish state
    # across the boundary. They become dead declarations once it is gone.
    orphaned_contracts:
      - platform/foundation/contracts/lib/src/agnostic_streams/i_auth_status_stream.dart
      - platform/foundation/contracts/lib/src/agnostic_streams/i_auth_session_state.dart
      - platform/foundation/contracts/lib/src/agnostic_streams/i_auth_refresh_listenable.dart
      - platform/foundation/contracts/lib/src/agnostic_streams/auth_session_failure.dart
      - platform/foundation/contracts/lib/src/actions/i_auth_action_handler.dart
      - platform/foundation/contracts/lib/src/navigators/auth_navigator.dart
    orphaned_keys:
      - "NavigatorKeys.nested('auth') in platform/foundation/contracts/lib/src/routing/navigator_keys.dart"
    breaks: []
    safe_couplings:
      - "platform_shell_adapters -> IAuthSessionGateway / IAuthSessionState (NetworkConfigImpl, getItOrNull at call time; no token is sent and no RefreshTokenInterceptor is installed)"
      - "feature_home -> IAuthStatusStream (getItOrNull at the route, passed as a factory param; Home shows the signed-out state)"
      - "feature_onboarding -> AuthNavigator (getItOrNull; the button goes to HomeNavigator instead)"
      - "feature_settings -> IAuthActionHandler (getItOrNull; the logout row is hidden)"

  home:
    packages: [feature_home]
    orphaned_contracts:
      - platform/foundation/contracts/lib/src/navigators/home_navigator.dart
    breaks: []
    safe_couplings:
      - "platform_app_shell -> HomeNavigator (getItOrNull; after sign-in the app goes to AppRouter.fallbackLocation)"
      - "feature_onboarding -> HomeNavigator (getItOrNull; only used when auth is absent too, and then the button does nothing)"
    note: >-
      Removing every INavDestinationModule leaves the dashboard with no tabs;
      AppRouter falls back to an empty branch rather than crashing.

  settings:
    packages: [feature_settings]
    breaks: []

  onboarding:
    packages: [feature_onboarding]
    breaks: []
    note: >-
      This is the only IAppEntryLocation. Without it the cold-start route falls
      back to the first dashboard tab, then to the '/_empty_dashboard'
      placeholder.

  cache:
    packages: [domain_cache, data_cache]
    breaks: []
    note: >-
      Nothing consumes it. Removing it also removes the only tests of
      core_database's DatabaseHandle and of WAL / foreign keys under
      driftMigrationStrategy (modules/cache/data/test/) — give them another
      fixture first if you want to keep that coverage.

  dashboard:
    packages: [feature_dashboard]
    orphaned_contracts:
      - platform/foundation/contracts/lib/src/routing/dashboard_route_module.dart
    breaks: []
    note: >-
      Tabs still render, without chrome — AppRouter falls back to the bare
      navigationShell. apps/admin runs this way.

  splash:
    packages: [feature_splash]
    orphaned_contracts:
      - platform/foundation/contracts/lib/src/app/i_app_splash_screen.dart
    breaks: []
    note: >-
      runShellApp (platform_app_shell) resolves it with getItOrNull, so the
      app simply keeps the native splash until the first frame.

# ---------------------------------------------------------------------------
# Shared files every bundle removal edits
# ---------------------------------------------------------------------------
# Documentation only: remove_sample.dart computes the list from every
# app_manifest.yaml it finds, so a new app is covered without editing this.
shared_files:
  - pubspec.yaml # workspace: entry per package
  - apps/<id>/app_manifest.yaml # modules: entry per bundle — the source of truth
  - apps/<id>/pubspec.yaml # generated dependency entry per package
  - apps/<id>/lib/di/injection.dart # generated import + ExternalModule entry

# Contracts that survive every removal: they are generic mechanisms, not
# feature-specific. Do not delete these while chasing orphans.
framework_contracts:
  - platform/foundation/contracts/lib/src/routing/routing_interfaces.dart # IFeatureRouteModule
  - platform/foundation/contracts/lib/src/routing/i_nav_destination_module.dart
  - platform/foundation/contracts/lib/src/routing/i_app_entry_location.dart
  - platform/foundation/contracts/lib/src/routing/navigator_keys.dart
  - platform/foundation/contracts/lib/src/feature_localization.dart
  - platform/foundation/contracts/lib/src/theme/i_theme_storage.dart
  - platform/foundation/contracts/lib/src/language/i_language_storage.dart
  - platform/foundation/contracts/lib/src/app/i_app_tree_wrapper.dart
